<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 폰 화면 폭에 맞춰 보이게. 폰에서 화면 전체가 확대되지 않게 막고, 확대는 종이만 두 손가락으로 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>pitex</title>
<!-- PWA(설치되는 웹앱) 설정: 앱 이름·아이콘이 적힌 파일 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6a4fe0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ────────────────────────────────────────────────
   pitex 시험판 (2단계 · 수정 3)
   화면 배치(위→아래): 창틀(탭·메뉴판·도구 줄·찾기 막대) / 책상(자 + A4 낱장 종이) / 상태 표시줄
   종이 = 맨 아래 '낱장 바탕' + 그 위 '글' + 맨 위 '그림 레이어' (그림은 글 위에 떠 있음)
   ──────────────────────────────────────────────── */
:root {
  --chrome: #f0f0f3;      /* 창틀(메뉴판·도구 줄) 바탕 */
  --desk: #d9d8e0;        /* 종이 바깥 '책상' 색 */
  --paper: #ffffff;       /* 글 쓰는 종이 */
  --fg: #000000;          /* 기본 글자 */
  --muted: #64626f;       /* 흐린 글자 */
  --line: #d6d5de;        /* 구분선 */
  --hover: #e2e1ea;       /* 마우스·손가락을 올렸을 때 */
  --accent: #6a4fe0;      /* 강조(보라) — smartDir과 같은 색 */
  --accent-soft: rgba(106,79,224,.12);
  --danger: #d23b3b;
  --box-bg: #f6f4fd;      /* 빈 그림 상자 바탕 */
  --menu-bg: #ffffff;     /* 펼친 메뉴·대화 창 바탕 */
  --card: #f6f6f9;        /* 설정 화면의 카드 바탕 */
  --ruler: #ececf1;       /* 자 바탕 */
  --ruler-margin: #d3d2db;/* 자의 여백 부분(어둡게) */
  --guide: rgba(40,90,255,.45);   /* 여백 안내선(파란 선) */
  --cross: rgba(106,79,224,.55);  /* 큰 십자 커서 선 */
  --toast-bg: #1d1c24; --toast-fg: #fff;
  --font-ui: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;  /* 메뉴 글꼴 */
  --font-text: "Malgun Gothic", sans-serif;   /* 글 글꼴 (설정에서 바꿈) */
  --text-size: 14.67px;   /* 글자 크기 (11pt) */
  --text-weight: 400;     /* 굵기 (Bold면 700) */
  --text-style: normal;   /* 기울임 (Italic이면 italic) */
  --line-h: 25px;         /* 한 줄 높이 — 페이지를 나누는 기준 */
}
/* 다크 모드: 달 단추를 누르면 켜짐. 종이 바탕은 진검정 #000000 */
:root[data-theme="dark"] {
  --chrome: #111114; --desk: #2c2b33; --paper: #000000; --fg: #ecebf2; --muted: #9a98a8; --line: #2f2e39; --hover: #2b2a35;
  --accent: #9d86ff; --accent-soft: rgba(157,134,255,.18); --danger: #ff6b6b; --box-bg: #15141b; --menu-bg: #1d1c24; --card: #26252e;
  --ruler: #1b1a21; --ruler-margin: #0d0d10; --guide: rgba(120,150,255,.5); --cross: rgba(190,175,255,.6);
  --toast-bg: #ecebf2; --toast-fg: #121117; color-scheme: dark; }

[hidden] { display: none !important; }   /* 숨김 표시된 것은 확실히 감추기 */
/* 바깥 화면 고정: 화면 전체는 움직이지 않음 */
html, body { height: 100%; margin: 0; overflow: hidden; }
body { display: flex; flex-direction: column; height: 100dvh; background: var(--chrome); color: var(--fg); font-family: var(--font-ui); font-size: 14px; -webkit-tap-highlight-color: transparent; }

/* ── 위쪽 창틀 ── */
.chrome { flex: none; position: relative; z-index: 6; background: var(--chrome); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
/* 맨 위 줄: pitex · [탭][탭][+] ……… 🌙 */
.titlebar { display: flex; align-items: flex-end; gap: 6px; padding: 5px 0 0 4px; font-size: 13px; color: var(--muted); }
.titlebar .logo { flex: none; font-weight: 700; color: var(--accent); align-self: center; padding-right: 2px; }
#tabs { flex: 0 1 auto; min-width: 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: flex; align-items: center; gap: 6px; max-width: 220px; height: 32px; padding: 0 6px 0 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0;
  background: transparent; color: var(--muted); font: 13px var(--font-ui); cursor: pointer; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--paper); color: var(--fg); border-color: var(--line); font-weight: 600; }
.tab .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .dot { color: var(--accent); }
.tab .x { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); font-size: 13px; }
.tab .x:hover { background: var(--hover); color: var(--fg); }
#tabNew { flex: none; width: 32px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--fg); font-size: 18px; cursor: pointer; align-self: center; }
#tabNew:hover { background: var(--hover); }
/* 오른쪽 위 달 모양 단추: 누를 때마다 밝게 ↔ 다크 */
#themeBtn { flex: none; margin-left: auto; width: 42px; height: 34px; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--fg); cursor: pointer; align-self: center; }
#themeBtn:hover { background: var(--hover); }
#themeBtn svg { width: 26px; height: 26px; }
:root[data-theme="dark"] #themeBtn { color: #ffd95a; }

/* 메뉴판: 파일 · 편집 · 찾기 · 보기 · 인코딩 · 그림 · 도움말 (좁으면 옆으로 밀어서) */
.menubar { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
.menubar::-webkit-scrollbar { display: none; }
.menubar > button { flex: none; font: 14px var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 4px; padding: 6px 11px; cursor: pointer; }
.menubar > button:hover, .menubar > button.open { background: var(--hover); }
.dropdown { position: fixed; z-index: 30; min-width: 240px; max-width: calc(100vw - 16px); background: var(--menu-bg); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px; max-height: 75vh; overflow-y: auto; }
.dropdown button { display: flex; width: 100%; gap: 10px; align-items: center; font: 14px var(--font-ui); color: var(--fg); background: transparent;
  border: 0; border-radius: 4px; padding: 9px 10px; cursor: pointer; text-align: left; }
.dropdown button:hover:not(:disabled) { background: var(--hover); }
.dropdown button:disabled { color: var(--muted); opacity: .6; cursor: default; }
.dropdown .ck { width: 16px; flex: none; color: var(--accent); }        /* ✓ 표시 자리 */
.dropdown .lb { flex: 1; }
.dropdown .key { color: var(--muted); font-size: 12px; }                 /* Ctrl+S 같은 단축키 */
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.dropdown .sub { padding-left: 22px; border-left: 2px solid var(--accent-soft); margin: 0 0 4px 16px; }   /* ▸ 하위 항목 */

/* 도구 줄: 자주 쓰는 것만 작은 단추로 */
.toolbar { display: flex; gap: 2px; align-items: center; padding: 3px 0 6px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.tb { flex: none; min-width: 36px; height: 34px; font: 15px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 5px; cursor: pointer; padding: 0 8px; }
.tb:hover:not(:disabled) { background: var(--hover); }
.tb.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tb:disabled { opacity: .35; cursor: default; }
.tb.wide { font-size: 13.5px; }
.sep { flex: none; width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.tb:focus-visible, .menubar > button:focus-visible, .dropdown button:focus-visible, #themeBtn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 찾기·바꾸기 막대 */
.findbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0 8px; border-top: 1px solid var(--line); }
.findbar input[type=text] { flex: 1 1 140px; min-width: 0; font: 14px var(--font-ui); color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; }
.findbar .fb { flex: none; font: 13.5px var(--font-ui); color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer; }
.findbar label { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.findbar .msg { font-size: 12.5px; color: var(--muted); }
.hint { margin: 0 0 8px; font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; }

/* ── 책상: 자(가로·세로)는 고정, 그 안의 종이만 밀림 ── */
#deskWrap { flex: 1; min-height: 0; position: relative; }
#desk { position: absolute; inset: 0; overflow: auto; background: var(--desk); overscroll-behavior: contain; touch-action: pan-x pan-y; }
body.ruler #desk { top: 20px; left: 20px; }               /* 자가 보이면 자 자리만큼 비켜 줌 (수정사항 3) */
#desk.quiet { scrollbar-width: none; }                    /* 1페이지일 때는 옆 수직 막대를 숨김 */
#desk.quiet::-webkit-scrollbar { display: none; }
#rulerH, #rulerV, #rulerCorner { position: absolute; display: none; z-index: 3; }
body.ruler #rulerH, body.ruler #rulerV, body.ruler #rulerCorner { display: block; }
#rulerH { top: 0; left: 20px; width: calc(100% - 20px); height: 20px; }   /* 캔버스는 폭·높이를 꼭 적어야 늘어남 */
#rulerV { top: 20px; left: 0; width: 20px; height: calc(100% - 20px); }
#rulerCorner { top: 0; left: 0; width: 20px; height: 20px; background: var(--ruler); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); box-sizing: border-box; }
/* 큰 십자 커서 (보기 › 커서 › Full screen) — 마우스를 따라 화면 끝까지 닿는 선 (수정사항 5) */
.cross { position: absolute; z-index: 4; pointer-events: none; background: var(--cross); display: none; }
#crossH { left: 0; right: 0; height: 1px; }
#crossV { top: 0; bottom: 0; width: 1px; }
body.crossfull #desk, body.crossfull #editor, body.crossfull .box { cursor: crosshair; }

#sizer { position: relative; margin: 0 auto; }            /* 확대·축소한 종이 크기만큼 자리를 잡아 주는 틀 */
#paper { position: absolute; left: 16px; top: 16px; width: 794px; transform-origin: 0 0; }  /* 794px = A4 폭 210mm */
/* 낱장 종이 (A4 한 장 = 794×1123점). 페이지마다 따로 그려 사이에 간격이 생김 (수정사항 4·9) */
.sheet { position: absolute; left: 0; width: 794px; height: 1123px; background: var(--paper); box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.sheet .guide { position: absolute; inset: 113px; border: 1px solid var(--guide); display: none; pointer-events: none; }   /* 3cm 여백 안내선 */
body.ruler .sheet .guide { display: block; }
#editor { position: relative; z-index: 1; box-sizing: border-box; padding: 113px; outline: none;    /* 113점 = 여백 30mm */
  font-family: var(--font-text); font-size: var(--text-size); font-weight: var(--text-weight); font-style: var(--text-style);
  line-height: var(--line-h); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; caret-color: var(--accent); color: var(--fg); }
body.nowrap #editor { white-space: pre; }
#editor p { margin: 0; }
/* 페이지 넘김 자리 (보이지 않는 빈칸): 다음 페이지 글이 위 여백 3cm 아래에서 시작하게 밀어 줌 */
.pgap { display: inline-block; width: 100%; vertical-align: top; line-height: 0; user-select: none; -webkit-user-select: none; }
div.pgap { display: block; }

/* ── 그림 레이어: 글 위에 떠 있는 그림 상자들 (수정사항 1·1_1·6) ── */
#layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
body.hide-layer #layer { display: none; }
.box { position: absolute; pointer-events: auto; border-radius: 6px; box-sizing: border-box; user-select: none; -webkit-user-select: none; cursor: grab; touch-action: none; }
.box img { width: 100%; height: 100%; display: block; border-radius: 6px; pointer-events: none; }
.box[data-fit="cover"] img { object-fit: cover; }
.box[data-fit="contain"] img { object-fit: contain; background: var(--box-bg); }
.box .ph { display: grid; width: 100%; height: 100%; border: 2px dashed var(--accent); border-radius: 6px; background: var(--box-bg); box-sizing: border-box; place-items: center; color: var(--accent); position: relative; }
.box .ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.box .ph b { position: relative; font-size: 26px; font-weight: 700; font-family: var(--font-ui); }
.box.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.box.moving { opacity: .85; cursor: grabbing; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.box .grip { display: none; position: absolute; right: -9px; bottom: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--paper); cursor: nwse-resize; }
.box.sel .grip { display: block; }
.box .pos { display: none; position: absolute; left: 0; top: -30px; background: var(--accent); color: #fff; font: 700 12px var(--font-ui); padding: 4px 8px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.box.moving .pos, .box.sizing .pos { display: block; }
#draw { position: absolute; inset: 0; z-index: 3; cursor: crosshair; touch-action: none; background: rgba(106,79,224,.04); }
#draw .rect { position: absolute; border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 4px; }
#draw .size { position: absolute; transform: translateY(8px); background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── 맨 아래: 상태 표시줄 ── */
.statusbar { flex: none; display: flex; background: var(--chrome); border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); overflow-x: auto; scrollbar-width: none; font-variant-numeric: tabular-nums;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.statusbar::-webkit-scrollbar { display: none; }
.statusbar span { flex: none; padding: 6px 10px; border-left: 1px solid var(--line); white-space: nowrap; }
.statusbar span:first-child { border-left: 0; }
.statusbar .grow { flex: 1; }
#sbPage { color: var(--fg); font-weight: 600; }
body.nostatus .statusbar { display: none; }

/* ── 대화 창(아래에서 올라옴) ── */
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }
.sheetdlg { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--menu-bg); border-radius: 14px 14px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  max-height: 86vh; overflow-y: auto; display: grid; gap: 12px; max-width: 760px; margin: 0 auto; box-sizing: border-box; }
.sheetdlg h2 { margin: 0; font-size: 18px; }
.sheetdlg h3 { margin: 4px 0 0; font-size: 14px; color: var(--fg); font-weight: 600; }
.sheetdlg p { margin: 0; color: var(--muted); line-height: 1.6; }
.btn { font: 500 14px var(--font-ui); color: var(--fg); background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; padding: 10px 13px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.fitpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fitpick button { border: 2px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px; cursor: pointer; color: var(--fg); font: 500 13.5px var(--font-ui); display: grid; gap: 6px; }
.fitpick button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.fitpick .pv { height: 64px; border-radius: 6px; overflow: hidden; background: var(--box-bg); }
.fitpick .pv img { width: 100%; height: 100%; display: block; }
.textin { font: 16px var(--font-ui); padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--fg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--toast-bg); color: var(--toast-fg); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 40px); }

/* ── 설정 화면: Windows 메모장 '텍스트 서식'과 같은 모양 ── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.card + .card { margin-top: -6px; }
.cardhead { box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; background: transparent; border: 0; color: var(--fg); font: 15px var(--font-ui); cursor: pointer; text-align: left; }
.cardhead .ic { width: 24px; flex: none; text-align: center; font-size: 16px; }
.cardhead .tx { flex: 1; display: grid; gap: 2px; }
.cardhead .tx small { color: var(--muted); font-size: 12.5px; }
.cardhead .chev { transition: transform .15s; }
.card.closed .cardhead .chev { transform: rotate(180deg); }
.card.closed .cardbody { display: none; }
.cardbody { border-top: 1px solid var(--line); }
.rowf { display: grid; grid-template-columns: 1fr minmax(150px, 250px); align-items: center; gap: 12px; padding: 10px 16px 10px 54px; border-bottom: 1px solid var(--line); }
.rowf select { font: 14px var(--font-ui); color: var(--fg); background: var(--menu-bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; width: 100%; }
.preview { padding: 26px 16px; text-align: center; color: var(--fg); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fontnote { padding: 0 16px 12px 54px; font-size: 12.5px; color: var(--muted); }
.fontnote button { font: 12.5px var(--font-ui); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.sw { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--fg); font: 14px var(--font-ui); cursor: pointer; flex: none; }
.sw i { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--muted); position: relative; box-sizing: border-box; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.sw[aria-checked="true"] i { background: var(--accent); border-color: var(--accent); }
.sw[aria-checked="true"] i::after { left: 23px; background: #fff; }

/* 그림·PDF로 만들 때: 고름 표시·안내선을 숨기고 밝은 색으로 */
body.exporting .guide, body.exporting #draw, body.exporting .grip, body.exporting .pos { display: none !important; }
body.exporting .box.sel { outline: 0; }

/* 인쇄: 창틀은 숨기고 종이만. 모든 페이지 위·아래·왼쪽·오른쪽 여백 30mm (수정사항 10) */
@media print {
  @page { size: A4; margin: 0; }
  html, body { height: auto; overflow: visible; background: #fff; display: block; }
  .chrome, .statusbar, #overlay, #menuLayer, #toastBox, #draw, #rulerH, #rulerV, #rulerCorner, .cross, #sheets { display: none !important; }
  #deskWrap, #desk { position: static; overflow: visible; background: #fff; }

<script>

let images = new Map();            // 상자 번호 → { url, data, name }

let handles = { txt: null, layer: null };   // 진짜 파일 (txt, 짝꿍)

/* ════════════════════════════════════════════════

   ════════════════════════════════════════════════ */
const LANGS = [                                    // smartDir과 같은 언어 + 중국어 번체 (아랍어는 나중에)
  ['ko', '한국어'], ['en', 'English'], ['ja', '日本語'], ['zh', '中文(简体)'], ['zh-TW', '中文(繁體)'],

];
let LANG = 'ko';
const I18N = {};                   // 번역은 맨 아래 번역표(ROWS)에서 채움
const t = s => (LANG !== 'ko' && I18N[LANG] && I18N[LANG][s]) || s;
const tf = (s, ...a) => t(s).replace(/\{(\d)\}/g, (_, i) => a[i]);

/* ── 작은 도구들 ── */
function h(tag, text, cls) { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }

}
function closeSheet() { $('overlay').innerHTML = ''; }
const store = {                                     // 브라우저 보관함 (작은 설정값용)
  get: k => { try { return localStorage.getItem('pitex.' + k); } catch (_) { return null; } },
  set: (k, v) => { try { localStorage.setItem('pitex.' + k, v); return true; } catch (_) { return false; } },

/* ════════════════════════════════════════════════
   1. 설정값
   ════════════════════════════════════════════════ */
const prefs = { theme: 'light', font: 'Malgun Gothic', style: 'Regular', size: 11, wrap: true, lang: 'ko', ruler: true, cursor: 'normal' };
try { Object.assign(prefs, JSON.parse(store.get('prefs2') || '{}')); } catch (_) {}
if (prefs.theme !== 'dark') prefs.theme = 'light';
const STYLES = ['Regular', 'Italic', 'Bold', 'Bold Italic'];
const PT_SIZES = [8, 9, 10, 11, 12, 14, 16, 18, 20, 22, 24, 26, 28, 36, 48, 72];
function savePrefs() { store.set('prefs2', JSON.stringify(prefs)); applyPrefs(); }
function applyPrefs() {
  root.setAttribute('data-theme', prefs.theme);
  $('themeBtn').setAttribute('aria-pressed', prefs.theme === 'dark');
  root.style.setProperty('--font-text', `"${prefs.font}", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`);
  root.style.setProperty('--text-weight', /Bold/.test(prefs.style) ? 700 : 400);
  root.style.setProperty('--text-style', /Italic/.test(prefs.style) ? 'italic' : 'normal');
  document.body.classList.toggle('nowrap', !prefs.wrap);
  document.body.classList.toggle('ruler', !!prefs.ruler);
  document.body.classList.toggle('crossfull', prefs.cursor === 'full' && !TOUCH);
  $('tbRuler').classList.toggle('on', !!prefs.ruler);
  if (LANG !== prefs.lang) { LANG = prefs.lang; applyLang(); }
  geometry(); layoutPages(); drawRulers();
}
$('themeBtn').onclick = () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); };

/* ════════════════════════════════════════════════
   2. A4 낱장과 페이지 나누기 (수정사항 4·9·10)
   한 줄 높이 = 글자 크기 × 1.7  →  한 페이지 = (297mm − 위아래 여백 60mm) 안에 들어가는 줄 수
   ════════════════════════════════════════════════ */
const MM = 96 / 25.4;                                 // 1mm = 3.78점
const A4W = 794, A4H = 1123, MARGIN = 113, GAP = 14;  // A4 = 794×1123점, 여백 30mm = 113점, 낱장 사이 간격
const STRIDE = A4H + GAP;                             // 한 장의 위 끝 → 다음 장의 위 끝
let lineH = 25, perPage = 35, pageH = 875, pages = 1, Z = 1, zoomFit = false;
const ZOOMS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
function geometry() {
  const px = prefs.size * 4 / 3;                    // pt → 화면 점(px)
  lineH = Math.round(px * 1.7);
  perPage = Math.max(1, Math.floor((A4H - 2 * MARGIN) / lineH));
  pageH = perPage * lineH;                          // 한 페이지에 들어가는 글 높이
  root.style.setProperty('--text-size', px + 'px');
  root.style.setProperty('--line-h', lineH + 'px');
}
const paras = () => [...ed.children].filter(n => n.tagName === 'P');
let composing = false;                                // 한글 조합 중에는 화면을 건드리지 않음
ed.addEventListener('compositionstart', () => composing = true);
ed.addEventListener('compositionend', () => { composing = false; layoutSoon(); });
let layoutQueued = false;
function layoutSoon() { if (!layoutQueued) { layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layoutPages(); }); } }

/* 커서 자리 기억하기/되돌리기: "몇 번째 문단의 몇 번째 글자" (페이지 빈칸은 세지 않음) */
function textMap(p) {
  const nodes = [], w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  let n, text = ''; while ((n = w.nextNode())) { nodes.push({ n, at: text.length }); text += n.nodeValue; }
  return { nodes, text };
}
function rangeIn(map, start, end) {                   // 문단 글자 위치(시작~끝) → 화면 범위
  const r = document.createRange();
  const pos = i => { for (let k = map.nodes.length - 1; k >= 0; k--) if (map.nodes[k].at <= i) return [map.nodes[k].n, Math.min(i - map.nodes[k].at, map.nodes[k].n.nodeValue.length)]; return null; };
  const a = pos(start), b = pos(end);
  if (!a || !b) return null;
  r.setStart(a[0], a[1]); r.setEnd(b[0], b[1]); return r;
}
function saveCaret() {
  const s = getSelection(); if (!s.rangeCount || !ed.contains(s.focusNode)) return null;
  const node = s.focusNode, p = (node.nodeType === 1 ? node : node.parentElement).closest('p'); if (!p || !ed.contains(p)) return null;
  const m = textMap(p); let o = 0;
  if (node.nodeType === 3) { const e = m.nodes.find(x => x.n === node); o = e ? e.at + s.focusOffset : 0; }
  else { for (let i = 0; i < s.focusOffset && i < node.childNodes.length; i++) o += (node.childNodes[i].textContent || '').length; }   // 문단 자체에 커서가 있을 때
  return { p: paras().indexOf(p), o };
}
function restoreCaret(c) {
  if (!c) return; const ps = paras(); const p = ps[Math.min(c.p, ps.length - 1)]; if (!p) return;
  const m = textMap(p), o = Math.min(c.o, m.text.length);
  let r = m.nodes.length ? rangeIn(m, o, o) : null;
  if (!r) { r = document.createRange(); r.setStart(p, 0); }
  r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function removeGaps() {                               // 페이지 빈칸 모두 빼기
  ed.querySelectorAll('.pgap').forEach(g => { const par = g.parentNode; g.remove(); if (par !== ed) par.normalize(); });
}
/* 종이 안 높이(점) b에서 시작하는 글 줄 앞에 빈칸 넣기 */
function insertGapAt(b, gapH) {
  const pr = paper.getBoundingClientRect();
  for (const p of paras()) {
    const top = p.offsetTop, bottom = top + p.offsetHeight;
    if (top >= b - 1) {                               // 문단이 새 페이지 첫 줄에서 시작 → 문단 앞에 빈칸 덩어리
      const g = h('div', '', 'pgap'); g.contentEditable = 'false'; g.style.height = gapH + 'px'; ed.insertBefore(g, p); return true;
    }
    if (bottom > b + 1) {                             // 문단이 페이지 경계에 걸침 → 경계 줄의 첫 글자 앞에
      const m = textMap(p), L = m.text.length;
      const topOf = i => { const r = rangeIn(m, i, i + 1); const rc = r && r.getClientRects()[0]; return rc ? (rc.top - pr.top) / Z : -1; };
      let lo = 0, hi2 = L;                            // 반씩 나눠 찾기: 경계 아래에 있는 첫 글자
      while (lo < hi2) { const mid = (lo + hi2) >> 1; if (topOf(mid) >= b - 1) hi2 = mid; else lo = mid + 1; }
      if (lo >= L) return false;
      const r = rangeIn(m, lo, lo); if (!r) return false;

    }

function layoutPages() {
  if (composing) return;

  const gapH = STRIDE - pageH;                        // 한 페이지 글 끝 → 다음 장 위 여백 아래까지
  for (;;) {

    const ps = paras(), last = ps[ps.length - 1];

    if (!insertGapAt(b, gapH) || pages > 999) break;
    pages++;

  restoreCaret(keep);
  ed.style.minHeight = (pages * STRIDE - GAP) + 'px';
  while (sheetsEl.children.length < pages) { const s = h('div', '', 'sheet'); s.append(h('div', '', 'guide')); sheetsEl.append(s); }   // 낱장 그리기
  while (sheetsEl.children.length > pages) sheetsEl.lastChild.remove();

}
function sizeDesk() {                                 // 확대·축소에 맞춰 책상 크기 정하기
  if (zoomFit) Z = fitZ();
  paper.style.transform = Z === 1 ? '' : `scale(${Z})`;
  const w = Math.max(A4W, ed.scrollWidth);
  sizer.style.width = (w * Z + 32) + 'px';
  sizer.style.height = ((pages * STRIDE - GAP) * Z + 32) + 'px';

/* ════════════════════════════════════════════════
   3. 자 (가로·세로, mm) — Ctrl+R로 보이기/숨기기, 종이를 밀어도 자는 제자리 (수정사항 3)
   ════════════════════════════════════════════════ */
function css(v) { return getComputedStyle(root).getPropertyValue(v).trim(); }
function prepCanvas(c) {
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, hh = c.clientHeight;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(hh * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(hh * dpr); }

function drawRulers() { if (!rulerQ) { rulerQ = true; requestAnimationFrame(() => { rulerQ = false; paintRulers(); }); } }
function paintRulers() {

  const lab = pxmm >= 6 ? 10 : pxmm >= 2.5 ? 20 : pxmm >= 1.2 ? 50 : 100;   // 숫자 간격 (사진처럼 20mm마다)
  const bg = css('--ruler'), mg = css('--ruler-margin'), fg = css('--muted'), ln = css('--line'), font = '10px ' + css('--font-ui');
  // 가로 자: 종이 왼쪽 끝이 0
  { const c = $('rulerH'), { g, w, h: hh } = prepCanvas(c), x0 = pr.left - c.getBoundingClientRect().left;
    g.fillStyle = bg; g.fillRect(0, 0, w, hh);
    g.fillStyle = mg; g.fillRect(x0, 0, 30 * pxmm, hh); g.fillRect(x0 + 180 * pxmm, 0, 30 * pxmm, hh);   // 여백 30mm는 어둡게
    g.strokeStyle = fg; g.fillStyle = fg; g.font = font; g.textBaseline = 'top'; g.lineWidth = 1; g.beginPath();
    for (let mm = 0; mm <= 210; mm += step) {

  { const c = $('rulerV'), { g, w, h: hh } = prepCanvas(c), y00 = pr.top - c.getBoundingClientRect().top;

      for (let mm = 0; mm <= 297; mm += step) {

/* ════════════════════════════════════════════════
   4. 그림 상자 (글 위 레이어에 고정) — 위치·크기는 mm
   b = { id, page(0부터), x, y(그 장의 왼쪽 위에서 mm), w, h(mm), fit('cover'|'contain') }
   ════════════════════════════════════════════════ */
const X_SVG = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="100" y2="100" stroke="currentColor" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/><line x1="100" y1="0" x2="0" y2="100" stroke="currentColor" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>';

}

}

  if (maxPage > pages - 1) {                          // 글보다 뒤쪽 장에 그림이 있으면 그 장까지 종이를 늘림
    pages = maxPage + 1; ed.style.minHeight = (pages * STRIDE - GAP) + 'px';
    while (sheetsEl.children.length < pages) { const s = h('div', '', 'sheet'); s.append(h('div', '', 'guide')); sheetsEl.append(s); }

}
function fillBox(f) {                                 // 그림이 있으면 그림, 없으면 X 표시

  f.append(h('span', '', 'grip'), h('span', '', 'pos'));   // 크기 바꾸기 동그라미, 위치 표시
}

}

/* 상자 누르기 / 누른 채 끌어 원하는 곳에 놓기 / 오른쪽 아래 동그라미로 크기 바꾸기 / 두 번 누르기 = 그림 넣기 */
let mv = null, lastTap = { f: null, t: 0 };
layer.addEventListener('pointerdown', e => {
  const f = e.target.closest('.box'); if (!f || e.button === 2) return;
  e.preventDefault(); selectBox(f);
  const now = Date.now();
  if (lastTap.f === f && now - lastTap.t < 400) { lastTap = { f: null, t: 0 }; pictureSheet(f); return; }   // 두 번 누르기
  lastTap = { f, t: now };
  mv = { f, kind: e.target.classList.contains('grip') ? 'size' : 'move', sx: e.clientX, sy: e.clientY,
    x0: +f.dataset.x, top0: +f.dataset.page * STRIDE + +f.dataset.y * MM, w0: +f.dataset.w, h0: +f.dataset.h, moved: false };
  try { f.setPointerCapture(e.pointerId); } catch (_) {}
});
layer.addEventListener('pointermove', e => {
  if (!mv) return;

  } else {                                            // 옮기기: 그림이 손가락을 따라옴

    d.y = r1(Math.max(-+d.h + 5, Math.min(297 - 5, (topPx - page * STRIDE) / MM)));
    d.x = r1(Math.max(-+d.w + 5, Math.min(210 - 5, mv.x0 + dx / MM)));

});

/* ════════════════════════════════════════════════
   5. 글 ↔ 저장 내용 (글은 txt, 그림 상자는 짝꿍 파일)
   ════════════════════════════════════════════════ */
function toModel() {
  const lines = paras().map(p => textMap(p).text.replace(/​/g, ''));
  const boxes = allBoxes().map(f => {
    const d = f.dataset, im = images.get(d.id);
    return { id: d.id, page: +d.page, x: +d.x, y: +d.y, w: +d.w, h: +d.h, fit: d.fit, image: im ? 'images/' + im.name : null };
  });
  return { text: lines.join('\n'), boxes };
}
function fromModel(text, boxes) {
  ed.innerHTML = ''; layer.innerHTML = ''; selBox = null;
  text.split('\n').forEach(tx => { const p = document.createElement('p'); if (tx) p.textContent = tx; else p.append(document.createElement('br')); ed.append(p); });
  ensureShape(); layoutPages();
  (boxes || []).forEach(b => {
    if (b.page === undefined) b = oldBox(b);          // 예전(문단에 붙던) 방식이면 지금 자리로 바꿈
    layer.append(makeBox(b));
  });
  layoutPages();
}
/* 1단계·2단계 짝꿍 파일(문단에 붙던 상자) → 지금 방식(장·mm) */
function oldBox(b) {
  const ps = paras(); let p = ps[b.para];
  if (b.paraText && (!p || !textMap(p).text.startsWith(b.paraText))) { const f = ps.find(q => textMap(q).text.startsWith(b.paraText)); if (f) p = f; }
  p = p || ps[ps.length - 1];
  const top = p ? p.offsetTop : MARGIN, page = Math.floor(top / STRIDE);
  const W = (A4W - 2 * MARGIN) / MM, w = b.side === 'full' ? W : r1((b.w || .45) * W), hh = r1((b.h || 120) / MM);
  return { id: b.id, page, x: b.side === 'right' ? r1(30 + W - w) : 30, y: r1((top - page * STRIDE) / MM), w: r1(w), h: hh, fit: b.fit || 'cover' };
}
function ensureShape() {                              // 모든 줄이 <p> 하나씩이 되게 바로잡기
  [...ed.childNodes].forEach(n => {
    if (n.nodeType === 1 && (n.tagName === 'P' || n.classList.contains('pgap'))) return;
    if (n.nodeType === 3 && !n.textContent.trim()) { n.remove(); return; }
    const p = document.createElement('p');
    if (n.nodeType === 1 && n.tagName === 'DIV') { while (n.firstChild) p.append(n.firstChild); n.replaceWith(p); }
    else if (n.nodeType === 1 && n.tagName === 'BR') { p.append(document.createElement('br')); n.replaceWith(p); }
    else { n.replaceWith(p); p.append(n); }
  });
  if (!paras().length) { const p = document.createElement('p'); p.append(document.createElement('br')); ed.append(p); }
}

/* ════════════════════════════════════════════════
   6. 탭 (여러 파일) — 수정사항 9
   ════════════════════════════════════════════════ */
let docs = [], cur = 0;
function newDocObj(name, text, boxes) {
  return { id: newId(), name: name || t('제목 없음'), text: text || '', boxes: boxes || [], images: new Map(), fileInfo: { enc: 'UTF-8', eol: DEFAULT_EOL },
    handles: { txt: null, layer: null }, hist: [], hi: -1, saved: true, raw: null, scroll: [0, 0], caret: null };
}
function stash() {                                    // 지금 탭의 상태를 문서에 넣어 두기

  if (histT) snap();
  const m = toModel(); Object.assign(d, { text: m.text, boxes: m.boxes, images, fileInfo, handles, hist, hi, saved: fileSaved, raw: rawBytes, scroll: [desk.scrollLeft, desk.scrollTop], caret: saveCaret() });
}
function loadDoc(i) {                                 // i번째 탭을 화면에 펼치기
  cur = i; const d = docs[i];
  images = d.images; fileInfo = d.fileInfo; handles = d.handles; hist = d.hist; hi = d.hi; fileSaved = d.saved; rawBytes = d.raw;
  fromModel(d.text, d.boxes);
  if (!hist.length) snap(); undoState();
  renderTabs(); desk.scrollTo(d.scroll[0], d.scroll[1]);
  if (d.caret) { ed.focus({ preventScroll: true }); restoreCaret(d.caret); }
  document.title = d.name + ' - pitex';
}
function switchTab(i) { if (i === cur || !docs[i]) return; stash(); selectBox(null); loadDoc(i); saveSessionSoon(); }
function addTab(d, activate = true) { stash(); docs.push(d); if (activate) loadDoc(docs.length - 1); else renderTabs(); saveSessionSoon(); return d; }
function closeTab(i) {

function renameSheet(i) {

  openSheet(sh => {

    const ok = () => { const v = inp.value.trim(); if (!v) return; d.name = v; closeSheet(); renderTabs(); document.title = v + ' - pitex'; saveSessionSoon(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });

const curDoc = () => docs[cur];
const docName = () => (curDoc() && curDoc().name) || t('제목 없음');

/* ── 탭 모두 되살리기: 기기 안 보관함(IndexedDB)에 저장. 파일 연결까지 기억 ── */
const idb = {
  open() { return new Promise((ok, no) => { const r = indexedDB.open('pitex', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((ok, no) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((ok, no) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = ok; tx.onerror = () => no(tx.error); }); },
};
let sessT = null;
function saveSessionSoon() { clearTimeout(sessT); sessT = setTimeout(saveSession, 800); }
async function saveSession() {
  stash();
  const pack = d => ({ id: d.id, name: d.name, text: d.text, boxes: d.boxes, images: [...d.images].map(([k, v]) => [k, { name: v.name, data: v.data }]),
    fileInfo: d.fileInfo, handles: d.handles, saved: d.saved, raw: d.raw && d.raw.byteLength < 4e6 ? d.raw : null });
  const s = { v: 3, cur, docs: docs.map(pack) };
  try { await idb.set('session', s); }
  catch (_) {                                         // 보관함을 못 쓰면 글만이라도 브라우저에
    store.set('session', JSON.stringify({ v: 3, cur, docs: docs.map(d => ({ name: d.name, text: d.text, boxes: d.boxes, fileInfo: d.fileInfo, saved: d.saved })) }));
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveSession(); });
async function loadSession() {

  if (!s) { try { s = JSON.parse(store.get('session') || 'null'); } catch (_) {} }
  if (!s || !s.docs || !s.docs.length) {             // 2단계(탭 없던 때)에 보관한 글이 있으면 가져옴
    try { const o = JSON.parse(store.get('doc') || 'null'); if (o && typeof o.text === 'string') s = { cur: 0, docs: [{ name: o.name, text: o.text, boxes: o.boxes, images: Object.entries(o.images || {}), fileInfo: o.fileInfo, saved: true }] }; } catch (_) {}
  }
  if (!s || !s.docs || !s.docs.length) return false;
  docs = s.docs.map(o => {
    const d = newDocObj(o.name, o.text, o.boxes);
    (o.images || []).forEach(([k, v]) => { if (v && v.data) d.images.set(k, { url: v.data, data: v.data, name: v.name }); });
    if (o.fileInfo) d.fileInfo = o.fileInfo;
    if (d.fileInfo.enc === 'UTF-16') d.fileInfo.enc = 'UTF-16 LE';
    if (o.handles) d.handles = o.handles;
    d.saved = o.saved !== false; d.raw = o.raw || null; if (o.id) d.id = o.id;
    return d;
  });

  return true;
}

/* ════════════════════════════════════════════════
   7. 상태 표시줄

let curPage = 1;

function loadScript(src) {

    const s = document.createElement('script'); s.src = src; s.dataset.src = src; s.onload = ok; s.onerror = () => { s.remove(); no(new Error('load')); }; document.head.append(s);
  });
}
async function exportPitex() { if (await saveBlob(new Blob([layerJson(true)], { type: 'application/x-pitex' }), docName() + '.pitex', T_PIT())) toast(t('PITEX 파일로 보냈습니다.')); }

/* HTML: A4 낱장 모양 그대로 (글 + 그 위에 떠 있는 그림) — 화면의 종이를 그대로 옮겨 적음 */
async function exportHtml() {

  const body = ed.innerHTML.replace(/ contenteditable="false"/g, '');

  const font = `${/Italic/.test(prefs.style) ? 'italic ' : ''}${/Bold/.test(prefs.style) ? '700' : '400'} ${prefs.size}pt/${lineH}px "${prefs.font}", "Malgun Gothic", sans-serif`;
  const doc = `<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>${esc(docName())}</title>\n<style>body{margin:0;background:#d9d8e0}main{position:relative;width:794px;height:${pages * STRIDE - GAP}px;margin:20px auto}.sh{position:absolute;left:0;width:794px;height:1123px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}.ed{position:relative;padding:113px;font:${font};color:#111;white-space:${prefs.wrap ? 'pre-wrap' : 'pre'};word-break:keep-all;overflow-wrap:anywhere}p{margin:0}.pgap{display:inline-block;width:100%;vertical-align:top}div.pgap{display:block}img{position:absolute;border-radius:6px}</style>\n</head>\n<body><main>${sheets}<div class="ed">${body}</div>${figs}</main></body>\n</html>\n`;

/* 낱장을 한 장씩 그림으로 찍기 (그림·PDF 보내기에서 함께 씀) */
async function renderPages() {
  await loadScript(LIB.h2c);
  selectBox(null); if (boxMode) setBoxMode(false);
  const S = 2, keepZ = Z, keepFit = zoomFit, keepScroll = [desk.scrollLeft, desk.scrollTop];
  Z = 1; zoomFit = false; sizeDesk(); desk.scrollTo(0, 0);
  try {
    const full = await html2canvas(paper, { scale: S, backgroundColor: '#d9d8e0', logging: false, windowHeight: (pages * STRIDE) + 200, width: A4W, height: pages * STRIDE - GAP,
      onclone: doc => {
        doc.documentElement.setAttribute('data-theme', 'light'); doc.body.classList.add('exporting');
        doc.documentElement.style.overflow = doc.body.style.overflow = 'visible'; doc.body.style.height = 'auto';
        ['deskWrap', 'desk'].forEach(id => { const d = doc.getElementById(id); d.style.position = 'static'; d.style.overflow = 'visible'; });
        doc.querySelectorAll('.box img').forEach(im => {   // 그림 찍는 도구가 object-fit을 몰라 배경 그림 방식으로
          const fit = im.closest('.box').dataset.fit === 'contain' ? 'contain' : 'cover';
          const dv = doc.createElement('div');
          dv.style.cssText = `width:100%;height:100%;border-radius:6px;background:url("${im.src}") center/${fit} no-repeat` + (fit === 'contain' ? ',#f6f4fd' : '');
          im.replaceWith(dv);
        });
      } });
    const out = [];
    for (let k = 0; k < pages; k++) {                 // 장마다 잘라 내기
      const c = document.createElement('canvas'); c.width = A4W * S; c.height = A4H * S;
      const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(full, 0, k * STRIDE * S, A4W * S, A4H * S, 0, 0, A4W * S, A4H * S);
      out.push(c);
    }
    return out;
  } finally { Z = keepZ; zoomFit = keepFit; sizeDesk(); desk.scrollTo(keepScroll[0], keepScroll[1]); }
}
function exportImageSheet() {

    sh.append(h('h2', t('그림으로 보내기')), h('p', t('JPG는 파일이 작고, PNG는 글자가 더 또렷합니다. 여러 페이지는 위아래로 이어 붙여 한 장으로 만듭니다.')), row, btn(t('닫기'), closeSheet));

async function exportImage(fmt) {
  toast(t('그림을 만드는 중…'), 10000);
  try {
    const ps = await renderPages(), gap = 24;
    const c = document.createElement('canvas'); c.width = ps[0].width; c.height = ps.length * ps[0].height + (ps.length - 1) * gap;
    const g = c.getContext('2d'); g.fillStyle = '#d9d8e0'; g.fillRect(0, 0, c.width, c.height);
    ps.forEach((p, i) => g.drawImage(p, 0, i * (p.height + gap)));
    const blob = await new Promise(ok => c.toBlob(ok, 'image/' + fmt, .92));
    const ext = fmt === 'png' ? '.png' : '.jpg';
    if (await saveBlob(blob, docName() + ext, { description: fmt.toUpperCase(), accept: { ['image/' + fmt]: [ext] } })) toast(t('그림으로 보냈습니다.'));
  } catch (e) { toast(t('그림을 만들지 못했습니다. 인터넷 연결을 확인해 주세요.'), 4000); }
}
async function exportPdf() {
  toast(t('PDF를 만드는 중…'), 10000);

    const ps = await renderPages(); await loadScript(LIB.pdf);
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    ps.forEach((c, i) => { if (i) doc.addPage(); doc.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 210, 297); });
    if (await saveBlob(doc.output('blob'), docName() + '.pdf', { description: 'PDF', accept: { 'application/pdf': ['.pdf'] } })) toast(t('PDF로 보냈습니다.'));
  } catch (e) { toast(t('PDF를 만들지 못했습니다. 인터넷 연결을 확인해 주세요.'), 4000); }
}
/* 인쇄: 장마다 정확히 297mm가 되게 빈칸·그림 자리를 mm로 바꿨다가, 끝나면 되돌림 (수정사항 10) */

/* ════════════════════════════════════════════════
   14. 확대·축소 · 폰은 A4를 화면 폭에 맞춤 + 두 손가락으로 확대 (수정사항 8)
   ════════════════════════════════════════════════ */
function zoom(d) {
  let base = zoomFit ? fitZ() : Z;
  if (d === 0) { zoomFit = TOUCH || desk.clientWidth < A4W + 32; Z = zoomFit ? fitZ() : 1; }
  else { const next = d > 0 ? ZOOMS.find(z => z > base + .001) : [...ZOOMS].reverse().find(z => z < base - .001); zoomFit = false; Z = next || base; }
  if (!TOUCH) store.set('zoom', zoomFit ? 'fit' : Z);
  sizeDesk();
}
$('tbZoomIn').onclick = () => zoom(1);
$('tbZoomOut').onclick = () => zoom(-1);
/* 두 손가락 벌리기·오므리기: 종이만 확대 (메뉴는 그대로). 한 손가락은 보통처럼 밀기 */
let pinch = null;
const mid = ts => ({ x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2, d: Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY) || 1 });
desk.addEventListener('touchstart', e => { if (e.touches.length === 2) { const m = mid(e.touches); pinch = { ...m, z: Z }; mv = null; } }, { passive: true });
desk.addEventListener('touchmove', e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();                                   // 두 손가락일 때는 화면이 밀리지 않게
  const m = mid(e.touches), r = desk.getBoundingClientRect();
  const ux = (desk.scrollLeft + pinch.x - r.left - 16) / pinch.z, uy = (desk.scrollTop + pinch.y - r.top - 16) / pinch.z;   // 손가락 가운데의 종이 위 자리
  zoomFit = false; Z = Math.max(fitZ() * .9, Math.min(3, pinch.z * m.d / pinch.d)); sizeDesk();
  desk.scrollLeft = ux * Z + 16 - (m.x - r.left); desk.scrollTop = uy * Z + 16 - (m.y - r.top);
  pinch = { ...m, z: Z };
}, { passive: false });
desk.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });

/* 폰 '뒤로': 한 번 더 누르면 종료 (smartDir과 같게) */
if (TOUCH) {
  history.pushState({ pitex: 1 }, '');

    if (openMenu) { closeMenu(); history.pushState({ pitex: 1 }, ''); return; }
    if (Date.now() - lastBack < 2000) { saveSession(); history.back(); return; }   // 2초 안에 한 번 더 → 종료
    lastBack = Date.now(); toast(t('한 번 더 누르면 종료됩니다'), 2000);
    history.pushState({ pitex: 1 }, '');
  });
}

  "글은 순수 txt로, 그림 상자는 짝꿍 파일(.txtx.pitex)로 저장하는 메모장입니다. pitex가 없는 사람에게는 txt 하나만 보입니다.": ["A notepad that saves text as plain txt and picture boxes in a companion file (.txtx.pitex). People without pitex just see the txt.", "本文は純粋な txt で、画像ボックスはペアファイル (.txtx.pitex) で保存するメモ帳です。pitex がない人には txt だけが見えます。", "正文保存为纯 txt，图片框保存在配套文件 (.txtx.pitex) 中的记事本。没有 pitex 的人只会看到 txt。", "正文儲存為純 txt，圖片框儲存在配套檔案 (.txtx.pitex) 中的記事本。沒有 pitex 的人只會看到 txt。", "Trình ghi chú lưu văn bản dạng txt thuần và khung hình trong tệp đi kèm (.txtx.pitex). Người không có pitex chỉ thấy tệp txt.", "Ein Editor, der Text als reines txt und Bildrahmen in einer Begleitdatei (.txtx.pitex) speichert. Wer pitex nicht hat, sieht nur das txt.", "Un bloc-notes qui enregistre le texte en txt pur et les cadres dans un fichier compagnon (.txtx.pitex). Sans pitex, on ne voit que le txt.", "Um bloco de notas que salva o texto em txt puro e as caixas de imagem num arquivo complementar (.txtx.pitex). Quem não tem pitex vê só o txt.", "Un bloc de notas que guarda el texto como txt puro y los cuadros de imagen en un archivo complementario (.txtx.pitex). Quien no tiene pitex solo ve el txt."],

  "설치된 글꼴을 보려면 허락이 필요합니다. ": ["Permission is needed to list installed fonts. ", "インストール済みフォントを表示するには許可が必要です。", "需要授权才能显示已安装的字体。", "需要授權才能顯示已安裝的字型。", "Cần cho phép để hiện các phông đã cài. ", "Zum Anzeigen installierter Schriftarten ist eine Erlaubnis nötig. ", "Une autorisation est nécessaire pour lister les polices installées. ", "É preciso permitir para listar as fontes instaladas. ", "Se necesita permiso para listar las fuentes instaladas. "],

  "시작점을 누른 채 대각선으로 끌면 그림 자리(X 상자)가 생깁니다. □ 그림 상자를 다시 누르면 그리기를 끕니다.": ["Press and drag diagonally to create a picture box (X box). Press □ Picture box again to stop drawing.", "始点を押したまま斜めにドラッグすると画像の枠（Xボックス）ができます。□ 画像ボックスをもう一度押すと描画を終了します。", "按住起点沿对角线拖动即可创建图片框（X 框）。再次点击 □ 图片框可结束绘制。", "按住起點沿對角線拖動即可建立圖片框（X 框）。再次點選 □ 圖片框可結束繪製。", "Giữ điểm bắt đầu rồi kéo chéo để tạo khung hình (khung X). Nhấn lại □ Khung hình để tắt vẽ.", "Startpunkt halten und diagonal ziehen, um einen Bildrahmen (X-Rahmen) zu erstellen. □ Bildrahmen erneut drücken, um das Zeichnen zu beenden.", "Maintenez le point de départ et glissez en diagonale pour créer un cadre (cadre X). Appuyez à nouveau sur □ Cadre pour arrêter.", "Segure o ponto inicial e arraste na diagonal para criar uma caixa (caixa X). Toque de novo em □ Caixa para parar.", "Mantén el punto inicial y arrastra en diagonal para crear un cuadro (cuadro X). Toca de nuevo □ Cuadro para dejar de dibujar."],

  "언어는 smartDir 번역표와 같고, 중국어 번체를 더했습니다. (아랍어는 나중에 결정)": ["Languages follow the smartDir translation table, plus Traditional Chinese. (Arabic to be decided later)", "言語は smartDir の翻訳表と同じです。（アラビア語は後で決定）", "语言与 smartDir 翻译表相同。（阿拉伯语以后再定）", "語言與 smartDir 翻譯表相同。（阿拉伯語以後再定）", "Ngôn ngữ giống bảng dịch của smartDir. (Tiếng Ả Rập sẽ quyết định sau)", "Die Sprachen entsprechen der smartDir-Übersetzungstabelle. (Arabisch wird später entschieden)", "Les langues suivent la table de traduction de smartDir. (L’arabe sera décidé plus tard)", "Os idiomas seguem a tabela de tradução do smartDir. (Árabe será decidido depois)", "Los idiomas siguen la tabla de traducción de smartDir. (El árabe se decidirá después)"],

  "이 그림을 읽지 못했습니다. 다른 그림을 골라 주세요.": ["Could not read this picture. Please choose another.", "この画像を読み込めませんでした。別の画像を選んでください。", "无法读取此图片。请选择其他图片。", "無法讀取此圖片。請選擇其他圖片。", "Không đọc được hình này. Vui lòng chọn hình khác.", "Dieses Bild konnte nicht gelesen werden. Bitte ein anderes wählen.", "Impossible de lire cette image. Choisissez-en une autre.", "Não foi possível ler esta imagem. Escolha outra.", "No se pudo leer esta imagen. Elige otra."],
  "이 브라우저는 설치된 글꼴 목록을 보여 줄 수 없어 자주 쓰는 글꼴만 보입니다.": ["This browser cannot list installed fonts, so only common fonts are shown.", "このブラウザーはインストール済みフォントを一覧表示できないため、よく使うフォントだけを表示します。", "此浏览器无法列出已安装的字体，因此只显示常用字体。", "此瀏覽器無法列出已安裝的字型，因此只顯示常用字型。", "Trình duyệt này không liệt kê được phông đã cài nên chỉ hiện các phông phổ biến.", "Dieser Browser kann installierte Schriftarten nicht auflisten; es werden nur gängige angezeigt.", "Ce navigateur ne peut pas lister les polices installées ; seules les polices courantes sont affichées.", "Este navegador não lista as fontes instaladas; só as mais comuns aparecem.", "Este navegador no puede listar las fuentes instaladas; solo se muestran las más comunes."],
  "이 브라우저는 파일 창을 쓸 수 없어 내려받기로 저장합니다.": ["This browser has no file dialog, so the file is saved as a download.", "このブラウザーはファイルダイアログを使えないため、ダウンロードで保存します。", "此浏览器无法使用文件对话框，将以下载方式保存。", "此瀏覽器無法使用檔案對話方塊，將以下載方式儲存。", "Trình duyệt này không có hộp thoại tệp nên sẽ lưu bằng cách tải xuống.", "Dieser Browser hat keinen Dateidialog; die Datei wird heruntergeladen.", "Ce navigateur n’a pas de boîte de dialogue de fichiers ; le fichier sera téléchargé.", "Este navegador não tem janela de arquivos; o arquivo será baixado.", "Este navegador no tiene ventana de archivos; el archivo se descargará."],
  "이 시험판(PWA)에서는 화면의 글만 지우고, PC의 파일은 그대로 둡니다. 파일을 휴지통으로 보내는 기능은 Tauri(.exe) 판에서 넣습니다.": ["This trial (PWA) only clears the document on screen; files on your PC are kept. Sending files to the Recycle Bin comes in the Tauri (.exe) version.", "この試用版（PWA）では画面の文書だけを消去し、PCのファイルはそのまま残します。ファイルをごみ箱に送る機能は Tauri（.exe）版で追加します。", "此试用版（PWA）只清除屏幕上的文档，电脑中的文件保持不变。将文件移到回收站的功能会在 Tauri（.exe）版中加入。", "此試用版（PWA）只清除螢幕上的文件，電腦中的檔案保持不變。將檔案移到回收站的功能會在 Tauri（.exe）版中加入。", "Bản thử (PWA) này chỉ xóa tài liệu trên màn hình, tệp trên PC vẫn giữ nguyên. Tính năng chuyển tệp vào Thùng rác sẽ có ở bản Tauri (.exe).", "Diese Testversion (PWA) leert nur das Dokument auf dem Bildschirm; Dateien auf dem PC bleiben erhalten. Das Verschieben in den Papierkorb kommt in der Tauri-Version (.exe).", "Cette version d’essai (PWA) n’efface que le document à l’écran ; les fichiers du PC sont conservés. L’envoi à la Corbeille viendra avec la version Tauri (.exe).", "Esta versão de teste (PWA) só limpa o documento na tela; os arquivos do PC são mantidos. Enviar à Lixeira virá na versão Tauri (.exe).", "Esta versión de prueba (PWA) solo borra el documento en pantalla; los archivos de la PC se conservan. Enviar a la Papelera llegará en la versión Tauri (.exe)."],

  "이번에 바뀐 것: 그림 고정·끌어 놓기, 자(mm)와 Ctrl+R, 모든 페이지 3cm 여백, 큰 십자 커서, 인코딩 10가지, 여러 파일 탭, 폰 화면 맞춤과 두 손가락 확대, 인쇄 여백.": ["What’s new: fixed pictures you can drag anywhere, mm rulers with Ctrl+R, 3 cm margins on every page, full-screen crosshair cursor, 10 encodings, tabs for multiple files, fit-to-screen and pinch zoom on phones, print margins.", "今回の変更：画像の固定とドラッグ配置、mm 定規と Ctrl+R、全ページ 3cm 余白、大きな十字カーソル、10種類のエンコード、複数ファイルのタブ、スマホの画面合わせと2本指拡大、印刷余白。", "本次更新：图片固定并可拖放、毫米标尺与 Ctrl+R、所有页面 3 厘米边距、大十字光标、10 种编码、多文件标签页、手机适配屏幕与双指缩放、打印边距。", "本次更新：圖片固定並可拖放、毫米標尺與 Ctrl+R、所有頁面 3 釐米邊距、大十字游標、10 種編碼、多檔案標籤頁、手機適配螢幕與雙指縮放、列印邊距。", "Thay đổi lần này: hình cố định và kéo thả, thước mm và Ctrl+R, lề 3 cm mọi trang, con trỏ chữ thập lớn, 10 kiểu mã hóa, thẻ nhiều tệp, vừa màn hình điện thoại và phóng to hai ngón, lề in.", "Neu: fixierte, frei verschiebbare Bilder, mm-Lineale mit Strg+R, 3 cm Ränder auf jeder Seite, Vollbild-Fadenkreuz, 10 Codierungen, Tabs für mehrere Dateien, Bildschirmanpassung und Zwei-Finger-Zoom am Handy, Druckränder.", "Nouveautés : images fixes déplaçables partout, règles en mm avec Ctrl+R, marges de 3 cm sur chaque page, curseur en croix plein écran, 10 encodages, onglets multi-fichiers, ajustement à l’écran et zoom à deux doigts sur téléphone, marges d’impression.", "Novidades: imagens fixas que podem ser arrastadas, réguas em mm com Ctrl+R, margens de 3 cm em todas as páginas, cursor em cruz de tela cheia, 10 codificações, abas para vários arquivos, ajuste à tela e zoom com dois dedos no celular, margens de impressão.", "Novedades: imágenes fijas que se pueden arrastrar, reglas en mm con Ctrl+R, márgenes de 3 cm en todas las páginas, cursor en cruz de pantalla completa, 10 codificaciones, pestañas para varios archivos, ajuste a la pantalla y zoom con dos dedos en el celular, márgenes de impresión."],
