<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 폰 화면 폭에 맞춰 보이게 (이 줄이 없으면 PC 화면을 작게 줄여서 보여 줌) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pitex</title>
<!-- PWA(설치되는 웹앱) 설정: 앱 이름·아이콘이 적힌 파일 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6a4fe0">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ────────────────────────────────────────────────
   pitex 2단계 — 메모장(notepad) 모양 + A4 종이
   화면 배치(위→아래): 창틀(제목줄·메뉴판·도구 줄·찾기 막대) / 책상(A4 종이) / 상태 표시줄
   바깥 화면은 고정되어 움직이지 않고, 가운데 '책상'만 위아래·옆으로 밀림
   ──────────────────────────────────────────────── */
:root {
  --chrome: #f0f0f3;      /* 창틀(메뉴판·도구 줄) 바탕 */
  --desk: #d9d8e0;        /* 종이 바깥 '책상' 색 = 페이지 사이 간격 색 */
  --paper: #ffffff;       /* 글 쓰는 종이 */
  --fg: #000000;          /* 기본 글자 */
  --muted: #64626f;       /* 흐린 글자 */
  --line: #d6d5de;        /* 구분선 */
  --hover: #e2e1ea;       /* 마우스·손가락을 올렸을 때 */
  --accent: #6a4fe0;      /* 강조(보라) — smartDir과 같은 색 */
  --accent-soft: rgba(106,79,224,.12);
  --danger: #d23b3b;
  --box-bg: #f6f4fd;      /* 빈 그림 상자 바탕 */
  --menu-bg: #ffffff;     /* 펼친 메뉴·대화 창 바탕 */
  --card: #f6f6f9;        /* 설정 화면의 카드 바탕 */
  --toast-bg: #1d1c24; --toast-fg: #fff;
  --font-ui: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;  /* 메뉴 글꼴 */
  --font-text: "Malgun Gothic", sans-serif;   /* 글 글꼴 (설정에서 바꿈) */
  --text-size: 14.67px;   /* 글자 크기 (11pt) */
  --text-weight: 400;     /* 굵기 (Bold면 700) */
  --text-style: normal;   /* 기울임 (Italic이면 italic) */
  --line-h: 25px;         /* 한 줄 높이 — 페이지를 나누는 기준 */
}
/* 다크 모드: 달 단추를 누르면 켜짐. 종이 바탕은 진검정 #000000 */
:root[data-theme="dark"] {
  --chrome: #111114; --desk: #2c2b33; --paper: #000000; --fg: #ecebf2; --muted: #9a98a8; --line: #2f2e39; --hover: #2b2a35;
  --accent: #9d86ff; --accent-soft: rgba(157,134,255,.18); --danger: #ff6b6b; --box-bg: #15141b; --menu-bg: #1d1c24; --card: #26252e;
  --toast-bg: #ecebf2; --toast-fg: #121117; color-scheme: dark; }

[hidden] { display: none !important; }   /* 숨김 표시된 것은 확실히 감추기 */
/* 바깥 화면 고정: 화면 전체는 움직이지 않음 (수정사항 8) */
html, body { height: 100%; margin: 0; overflow: hidden; }
body { display: flex; flex-direction: column; height: 100dvh; background: var(--chrome); color: var(--fg); font-family: var(--font-ui); font-size: 14px; -webkit-tap-highlight-color: transparent; }

/* ── 위쪽 창틀 ── */
.chrome { flex: none; position: relative; z-index: 6; background: var(--chrome); border-bottom: 1px solid var(--line);
  padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
.titlebar { display: flex; align-items: center; gap: 6px; padding: 5px 0 1px 4px; font-size: 13px; color: var(--muted); }
.titlebar .logo { flex: none; font-weight: 700; color: var(--accent); }
#docName { flex: 0 1 auto; min-width: 60px; width: 14ch; font: 500 13px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px; }
#docName:hover, #docName:focus { border-color: var(--line); background: var(--paper); outline: none; }
.titlebar .ext, .titlebar .dirty { flex: none; }
.titlebar .dirty { color: var(--accent); }
/* 오른쪽 위 달 모양 단추: 누를 때마다 밝게 ↔ 다크 (수정사항 4) */
#themeBtn { flex: none; margin-left: auto; width: 42px; height: 36px; display: grid; place-items: center; background: transparent; border: 1px solid transparent; border-radius: 8px; color: var(--fg); cursor: pointer; }
#themeBtn:hover { background: var(--hover); }
#themeBtn svg { width: 26px; height: 26px; }
:root[data-theme="dark"] #themeBtn { color: #ffd95a; }

/* 메뉴판: 파일 · 편집 · 찾기 · 보기 · 인코딩 · 그림 · 도움말 (좁으면 옆으로 밀어서) */
.menubar { display: flex; overflow-x: auto; scrollbar-width: none; }
.menubar::-webkit-scrollbar { display: none; }
.menubar > button { flex: none; font: 14px var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 4px; padding: 6px 11px; cursor: pointer; }
.menubar > button:hover, .menubar > button.open { background: var(--hover); }
.dropdown { position: fixed; z-index: 30; min-width: 240px; max-width: calc(100vw - 16px); background: var(--menu-bg); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 4px; max-height: 75vh; overflow-y: auto; }
.dropdown button { display: flex; width: 100%; gap: 10px; align-items: center; font: 14px var(--font-ui); color: var(--fg); background: transparent;
  border: 0; border-radius: 4px; padding: 9px 10px; cursor: pointer; text-align: left; }
.dropdown button:hover:not(:disabled) { background: var(--hover); }
.dropdown button:disabled { color: var(--muted); opacity: .6; cursor: default; }
.dropdown .ck { width: 16px; flex: none; color: var(--accent); }        /* ✓ 표시 자리 */
.dropdown .lb { flex: 1; }
.dropdown .key { color: var(--muted); font-size: 12px; }                 /* Ctrl+S 같은 단축키 */
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.dropdown .sub { padding-left: 22px; border-left: 2px solid var(--accent-soft); margin: 0 0 4px 16px; }   /* 보내기 ▸ 하위 항목 */

/* 도구 줄: 자주 쓰는 것만 작은 단추로 */
.toolbar { display: flex; gap: 2px; align-items: center; padding: 3px 0 6px; overflow-x: auto; scrollbar-width: none; }
.toolbar::-webkit-scrollbar { display: none; }
.tb { flex: none; min-width: 36px; height: 34px; font: 15px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 5px; cursor: pointer; padding: 0 8px; }
.tb:hover:not(:disabled) { background: var(--hover); }
.tb.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tb:disabled { opacity: .35; cursor: default; }
.tb.wide { font-size: 13.5px; }
.sep { flex: none; width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.tb:focus-visible, .menubar > button:focus-visible, .dropdown button:focus-visible, #themeBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* 찾기·바꾸기 막대 */
.findbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0 8px; border-top: 1px solid var(--line); }
.findbar input[type=text] { flex: 1 1 140px; min-width: 0; font: 14px var(--font-ui); color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; }
.findbar .fb { flex: none; font: 13.5px var(--font-ui); color: var(--fg); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer; }
.findbar label { font-size: 13px; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.findbar .msg { font-size: 12.5px; color: var(--muted); }
.hint { margin: 0 0 8px; font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; }

/* ── 책상(밀리는 곳)과 A4 종이 ── */
#desk { flex: 1; min-height: 0; overflow: auto; background: var(--desk); overscroll-behavior: contain; position: relative; }
#desk.quiet { scrollbar-width: none; }               /* 1페이지일 때는 옆 수직 막대를 숨김 (수정사항 8·9) */
#desk.quiet::-webkit-scrollbar { display: none; }
#sizer { position: relative; margin: 0 auto; }       /* 확대·축소한 종이 크기만큼 자리를 잡아 주는 틀 */
#paper { position: absolute; left: 16px; top: 16px; width: 794px; background: var(--paper); transform-origin: 0 0; box-shadow: 0 1px 4px rgba(0,0,0,.18); }  /* 794px = A4 폭 210mm */
body.nowrap #paper { width: max-content; min-width: 794px; }   /* 자동 줄 바꿈을 끄면 긴 줄만큼 종이가 넓어짐 */
#editor { box-sizing: border-box; padding: 76px; outline: none; font-family: var(--font-text); font-size: var(--text-size); font-weight: var(--text-weight); font-style: var(--text-style);
  line-height: var(--line-h); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; caret-color: var(--accent); color: var(--fg); }   /* 76px = 여백 20mm */
body.nowrap #editor { white-space: pre; }
#editor p { margin: 0; display: flow-root; }   /* flow-root: 그림 상자가 자기 문단 안에 머물게 */
/* 페이지 사이 간격 (약 6px 굵은 띠) — 수정사항 9 */
.pb { position: absolute; left: -1px; right: -1px; height: 6px; background: var(--desk); pointer-events: none; z-index: 2; }

/* 그림 상자 (높이는 줄 높이에 맞춰 딱 떨어지게 → 페이지가 줄 사이에서 나뉨) */
.box { display: block; margin: 0 0 6px; position: relative; border-radius: 6px; box-sizing: border-box; user-select: none; -webkit-user-select: none; cursor: pointer; white-space: normal; }
.box[data-side="left"]  { float: left;  margin-right: 14px; }   /* 왼쪽에 붙음 → 글은 오른쪽으로 흐름 */
.box[data-side="right"] { float: right; margin-left: 14px; }    /* 오른쪽에 붙음 → 글은 왼쪽으로 흐름 */
.box[data-side="full"]  { width: 100% !important; }              /* 전체 폭 → 글은 위아래로 */
.box img { width: 100%; height: 100%; display: block; border-radius: 6px; pointer-events: none; }
.box[data-fit="cover"] img { object-fit: cover; }
.box[data-fit="contain"] img { object-fit: contain; background: var(--box-bg); }
.box .ph { display: grid; width: 100%; height: 100%; border: 2px dashed var(--accent); border-radius: 6px; background: var(--box-bg); box-sizing: border-box; place-items: center; color: var(--accent); }
.box .ph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.box .ph b { position: relative; font-size: 26px; font-weight: 700; font-family: var(--font-ui); font-style: normal; }
.box.sel { outline: 3px solid var(--accent); outline-offset: 2px; touch-action: none; }
.box .grip { display: none; position: absolute; right: -9px; bottom: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--paper); touch-action: none; cursor: nwse-resize; }
.box.sel .grip { display: block; }
.box.lifting { opacity: .35; }
body.hide-layer .box { display: none; }

#draw { position: absolute; inset: 0; z-index: 3; cursor: crosshair; touch-action: none; background: rgba(106,79,224,.04); }
#draw .rect { position: absolute; border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 4px; }
#draw .size { position: absolute; transform: translateY(8px); background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#boxbar { position: absolute; z-index: 4; display: flex; gap: 4px; flex-wrap: wrap; padding: 5px; background: var(--menu-bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15); max-width: 600px; font-style: normal; font-weight: 400; }
#boxbar button { font: 13.5px var(--font-ui); color: var(--fg); background: var(--chrome); border: 1px solid transparent; border-radius: 5px; padding: 7px 10px; cursor: pointer; }
#boxbar button.on { background: var(--accent); color: #fff; }
#boxbar button.danger { color: var(--danger); }
#ghost { position: fixed; z-index: 30; pointer-events: none; border: 2px dashed var(--accent); border-radius: 6px; background: var(--accent-soft); }

/* ── 맨 아래: 상태 표시줄 ── */
.statusbar { flex: none; display: flex; background: var(--chrome); border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); overflow-x: auto; scrollbar-width: none; font-variant-numeric: tabular-nums;
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.statusbar::-webkit-scrollbar { display: none; }
.statusbar span { flex: none; padding: 6px 10px; border-left: 1px solid var(--line); white-space: nowrap; }
.statusbar span:first-child { border-left: 0; }
.statusbar .grow { flex: 1; }
#sbPage { color: var(--fg); font-weight: 600; }   /* 지금 페이지 (수정사항 10) */
body.nostatus .statusbar { display: none; }

/* ── 대화 창(아래에서 올라옴) ── */
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--menu-bg); border-radius: 14px 14px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  max-height: 86vh; overflow-y: auto; display: grid; gap: 12px; max-width: 760px; margin: 0 auto; box-sizing: border-box; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet h3 { margin: 4px 0 0; font-size: 14px; color: var(--fg); font-weight: 600; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.6; }
.btn { font: 500 14px var(--font-ui); color: var(--fg); background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; padding: 10px 13px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.fitpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fitpick button { border: 2px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px; cursor: pointer; color: var(--fg); font: 500 13.5px var(--font-ui); display: grid; gap: 6px; }
.fitpick button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.fitpick .pv { height: 64px; border-radius: 6px; overflow: hidden; background: var(--box-bg); }
.fitpick .pv img { width: 100%; height: 100%; display: block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(44px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--toast-bg); color: var(--toast-fg); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 40px); }

/* ── 설정 화면: Windows 메모장 '텍스트 서식'과 같은 모양 (수정사항 5) ── */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
.card + .card { margin-top: -6px; }
.cardhead { box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; background: transparent; border: 0; color: var(--fg); font: 15px var(--font-ui); cursor: pointer; text-align: left; }
.cardhead .ic { width: 24px; flex: none; text-align: center; font-size: 16px; }
.cardhead .tx { flex: 1; display: grid; gap: 2px; }
.cardhead .tx small { color: var(--muted); font-size: 12.5px; }
.cardhead .chev { transition: transform .15s; }
.card.closed .cardhead .chev { transform: rotate(180deg); }
.card.closed .cardbody { display: none; }
.cardbody { border-top: 1px solid var(--line); }
.rowf { display: grid; grid-template-columns: 1fr minmax(150px, 250px); align-items: center; gap: 12px; padding: 10px 16px 10px 54px; border-bottom: 1px solid var(--line); }
.rowf select { font: 14px var(--font-ui); color: var(--fg); background: var(--menu-bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; width: 100%; }
.preview { padding: 26px 16px; text-align: center; color: var(--fg); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.fontnote { padding: 0 16px 12px 54px; font-size: 12.5px; color: var(--muted); }
.fontnote button { font: 12.5px var(--font-ui); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
/* 켬/끔 스위치 */
.sw { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--fg); font: 14px var(--font-ui); cursor: pointer; flex: none; }
.sw i { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--muted); position: relative; box-sizing: border-box; }
.sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.sw[aria-checked="true"] i { background: var(--accent); border-color: var(--accent); }
.sw[aria-checked="true"] i::after { left: 23px; background: #fff; }

/* 그림·PDF로 만들 때: 고름 표시·페이지 띠를 숨기고 밝은 색으로 */
body.exporting .pb, body.exporting #boxbar, body.exporting #draw, body.exporting .grip { display: none !important; }
body.exporting .box.sel { outline: 0; }

/* 인쇄: 창틀은 숨기고 종이만 A4로 */
@media print {
  @page { size: A4; margin: 0; }
  html, body { height: auto; overflow: visible; background: #fff; display: block; }
  .chrome, .statusbar, #overlay, #menuLayer, #toastBox, .pb, #boxbar, #draw { display: none !important; }
  #desk { overflow: visible; background: #fff; }
  #sizer { width: auto !important; height: auto !important; }
  #paper { position: static; transform: none !important; box-shadow: none; width: 210mm; background: #fff; }
  #editor { color: #000; }
  .box.sel { outline: 0; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(20px); opacity: .6; } } }
</style>
</head>
<body>

<!-- 위쪽 창틀 -->
<header class="chrome">
  <div class="titlebar">
    <span class="logo">pitex</span><span>·</span>
    <input id="docName" aria-label="파일 이름" value="제목 없음"><span class="ext">.txt</span>
    <span class="dirty" id="dirty" hidden>●</span>
    <!-- 달 모양 단추: 밝게 ↔ 다크 -->
    <button id="themeBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.9 9.9 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/></svg>
    </button>
  </div>
  <!-- 메뉴판 (이름은 언어에 따라 스크립트가 채움) -->
  <nav class="menubar" id="menubar">
    <button type="button" data-menu="file"></button>
    <button type="button" data-menu="edit"></button>
    <button type="button" data-menu="find"></button>
    <button type="button" data-menu="view"></button>
    <button type="button" data-menu="enc"></button>
    <button type="button" data-menu="pic"></button>
    <button type="button" data-menu="help"></button>
  </nav>
  <!-- 도구 줄 -->
  <div class="toolbar">
    <button class="tb" id="tbNew" type="button">📄</button>
    <button class="tb" id="tbOpen" type="button">📂</button>
    <button class="tb" id="tbSave" type="button">💾</button>
    <span class="sep"></span>
    <button class="tb" id="undoBtn" type="button">↶</button>
    <button class="tb" id="redoBtn" type="button">↷</button>
    <span class="sep"></span>
    <button class="tb" id="tbFind" type="button">🔍</button>
    <button class="tb wide" id="boxBtn" type="button"></button>
    <span class="sep"></span>
    <button class="tb" id="tbZoomOut" type="button">A−</button>
    <button class="tb" id="tbZoomIn" type="button">A+</button>
  </div>
  <!-- 찾기·바꾸기 막대 (찾기 메뉴에서 켬) -->
  <div class="findbar" id="findbar" hidden>
    <input type="text" id="findText">
    <input type="text" id="replText">
    <button class="fb" id="findNext" type="button"></button>
    <button class="fb" id="replOne" type="button"></button>
    <button class="fb" id="replAll" type="button"></button>
    <label><input type="checkbox" id="findCase"> <span id="findCaseLb"></span></label>
    <span class="msg" id="findMsg"></span>
    <button class="fb" id="findClose" type="button">✕</button>
  </div>
  <p class="hint" id="drawHint" hidden></p>
</header>

<!-- 책상: 이 안의 A4 종이만 밀림. 종이 = 아래층 글 + 위층 그림 상자 -->
<main id="desk">
  <div id="sizer">
    <div id="paper">
      <div id="editor" contenteditable="true" spellcheck="false"></div>
      <div id="breaks"></div>
      <div id="draw" hidden></div>
      <div id="boxbar" hidden></div>
    </div>
  </div>
</main>

<!-- 상태 표시줄 -->
<footer class="statusbar" id="statusbar">
  <span id="sbPos"></span>
  <span id="sbPage"></span>
  <span id="sbChars"></span>
  <span id="sbBoxes"></span>
  <span id="sbSaved" class="grow"></span>
  <span id="sbZoom"></span>
  <span id="sbEol"></span>
  <span id="sbEnc"></span>
</footer>

<div id="overlay"></div>
<div id="menuLayer"></div>
<div id="toastBox"></div>
<input type="file" id="pickImage" accept="image/*" hidden>
<input type="file" id="pickCamera" accept="image/*" capture="environment" hidden>
<!-- 진짜 파일 창이 없는 브라우저(폰 등)에서 쓰는 열기: txt와 짝꿍 파일을 함께 고를 수 있음 -->
<input type="file" id="pickOpen" accept=".txt,.pitex,text/plain" multiple hidden>

<script>
/* ════════════════════════════════════════════════
   pitex 2단계
   - 글은 contenteditable(폰 기본 글자판·한글 입력을 그대로 씀)
   - 그림 상자는 그 문단의 맨 앞에 붙는 "편집 안 되는 조각" → 글을 고쳐도 문단을 따라 움직임
   - A4 종이: 한 페이지 = 정해진 줄 수. 그림 상자 높이도 줄 높이에 맞춰 페이지가 줄 사이에서 나뉨
   - 파일: Edge·Chrome(PC)에서는 진짜 파일 열기·저장, 그 밖에서는 내려받기
   ════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const root = document.documentElement;
const ed = $('editor'), paper = $('paper'), desk = $('desk'), sizer = $('sizer'), drawLayer = $('draw'), bar = $('boxbar');
const images = new Map();          // 상자 번호 → { url(화면용 주소), data(저장용 글자 그림), name(파일 이름) }
let selBox = null;                 // 지금 고른 그림 상자
let boxMode = false;               // '그림 상자' 그리기 켜짐?
const IS_WIN = /Windows/i.test(navigator.userAgent);
const DEFAULT_EOL = IS_WIN ? 'CRLF' : 'LF';           // Windows판은 CR LF가 기본 (수정사항 7)
let fileInfo = { enc: 'UTF-8', eol: DEFAULT_EOL };   // 지금 글의 인코딩·줄 끝 방식 (저장할 때 그대로 지킴)
let seq = 0;                       // 상자 번호를 붙이는 일련번호
const newId = () => 'b' + Date.now().toString(36) + (++seq);
try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (_) {} // Enter = 새 문단(<p>)

/* ════════════════════════════════════════════════
   0. 언어 (한국어 글자를 열쇠로, 다른 언어 번역을 찾아 씀)
   ════════════════════════════════════════════════ */
const LANGS = [                                    // smartDir과 같은 언어 + 중국어 번체 (아랍어는 나중에)
  ['ko', '한국어'], ['en', 'English'], ['ja', '日本語'], ['zh', '中文(简体)'], ['zh-TW', '中文(繁體)'],
  ['vi', 'Tiếng Việt'], ['de', 'Deutsch'], ['fr', 'Français'], ['pt', 'Português'], ['es', 'Español'],
];
let LANG = 'ko';
const I18N = {};                   // 번역은 맨 아래 번역표(ROWS)에서 채움
const t = s => (LANG !== 'ko' && I18N[LANG] && I18N[LANG][s]) || s;                 // 번역 1개
const tf = (s, ...a) => t(s).replace(/\{(\d)\}/g, (_, i) => a[i]);                  // {0}{1} 자리에 값 넣기

/* ── 작은 도구들 ── */
function h(tag, text, cls) { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
function btn(label, fn, cls) { const b = h('button', label, 'btn' + (cls ? ' ' + cls : '')); b.type = 'button'; b.onclick = fn; return b; }
let toastT;
function toast(msg, ms) { const box = $('toastBox'); box.innerHTML = ''; box.append(h('div', msg, 'toast')); clearTimeout(toastT); toastT = setTimeout(() => box.innerHTML = '', ms || 2600); }
function openSheet(fill) {                          // 아래에서 올라오는 창
  const ov = $('overlay'); ov.innerHTML = '';
  const dim = h('div', '', 'dim'); dim.onclick = closeSheet;
  const sh = h('div', '', 'sheet'); sh.setAttribute('role', 'dialog');
  fill(sh); ov.append(dim, sh);
  return sh;
}
function closeSheet() { $('overlay').innerHTML = ''; }
const store = {                                     // 브라우저 보관함 (실패해도 앱은 동작)
  get: k => { try { return localStorage.getItem('pitex.' + k); } catch (_) { return null; } },
  set: (k, v) => { try { localStorage.setItem('pitex.' + k, v); return true; } catch (_) { return false; } },
};
const docName = () => ($('docName').value.trim() || t('제목 없음'));

/* ════════════════════════════════════════════════
   1. 설정값 (글꼴·스타일·크기·자동 줄 바꿈·화면·언어)
   ════════════════════════════════════════════════ */
const prefs = { theme: 'light', font: 'Malgun Gothic', style: 'Regular', size: 11, wrap: true, lang: 'ko' };
try { Object.assign(prefs, JSON.parse(store.get('prefs2') || '{}')); } catch (_) {}
if (prefs.theme !== 'dark') prefs.theme = 'light';                 // '자동'은 없앰 → 밝게가 기본 (수정사항 4)
const STYLES = ['Regular', 'Italic', 'Bold', 'Bold Italic'];          // 메모장과 같은 4가지
const PT_SIZES = [8, 9, 10, 11, 12, 14, 16, 18, 20, 22, 24, 26, 28, 36, 48, 72];   // 글자 크기 (pt)
function savePrefs() { store.set('prefs2', JSON.stringify(prefs)); applyPrefs(); }
function applyPrefs() {
  root.setAttribute('data-theme', prefs.theme);
  $('themeBtn').setAttribute('aria-pressed', prefs.theme === 'dark');
  root.style.setProperty('--font-text', `"${prefs.font}", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`);
  root.style.setProperty('--text-weight', /Bold/.test(prefs.style) ? 700 : 400);
  root.style.setProperty('--text-style', /Italic/.test(prefs.style) ? 'italic' : 'normal');
  document.body.classList.toggle('nowrap', !prefs.wrap);
  if (LANG !== prefs.lang) { LANG = prefs.lang; applyLang(); }
  geometry(); allBoxes().forEach(sizeBox); layoutSoon(); placeBar();
}
/* 달 단추: 누를 때마다 밝게 ↔ 다크 */
$('themeBtn').onclick = () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); };

/* ════════════════════════════════════════════════
   2. A4 종이와 페이지 나누기 (수정사항 8·9·10)
   한 줄 높이 = 글자 크기 × 1.7  →  한 페이지 = (A4 높이 − 위아래 여백) 안에 들어가는 줄 수
   ════════════════════════════════════════════════ */
const A4W = 794, A4H = 1123, MARGIN = 76, BOXM = 6;   // A4 = 794×1123점(96dpi), 여백 20mm = 76점, 상자 아래 간격 6점
let lineH = 25, perPage = 38, pageH = 950, pages = 1, Z = 1;   // Z = 화면 확대 배율
const ZOOMS = [0.5, 0.67, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
function geometry() {
  const px = prefs.size * 4 / 3;                    // pt → 화면 점(px)
  lineH = Math.round(px * 1.7);
  perPage = Math.max(1, Math.floor((A4H - 2 * MARGIN) / lineH));
  pageH = perPage * lineH;
  root.style.setProperty('--text-size', px + 'px');
  root.style.setProperty('--line-h', lineH + 'px');
}
let layoutQueued = false;
function layoutSoon() { if (!layoutQueued) { layoutQueued = true; requestAnimationFrame(() => { layoutQueued = false; layoutPages(); }); } }
function layoutPages() {
  const ps = paras(), last = ps[ps.length - 1];
  const contentH = last ? last.offsetTop + last.offsetHeight - MARGIN : lineH;   // 글이 차지한 높이
  pages = Math.max(1, Math.ceil((contentH - 1) / pageH));
  ed.style.minHeight = (2 * MARGIN + pages * pageH) + 'px';                       // 마지막 페이지도 끝까지 종이로
  const br = $('breaks'); br.innerHTML = '';                                      // 페이지 사이 띠 다시 그리기
  for (let k = 1; k < pages; k++) { const d = h('div', '', 'pb'); d.style.top = (MARGIN + k * pageH - 3) + 'px'; br.append(d); }
  paper.style.transform = Z === 1 ? '' : `scale(${Z})`;
  sizer.style.width = (paper.offsetWidth * Z + 32) + 'px';
  sizer.style.height = (paper.offsetHeight * Z + 32) + 'px';
  // 1페이지이고 옆으로도 다 들어가면 수직 막대를 숨김 → 다음 페이지로 넘어가면 막대가 생김
  desk.classList.toggle('quiet', pages === 1 && sizer.offsetWidth <= desk.clientWidth);
  status();
}
window.addEventListener('resize', () => { layoutSoon(); placeBar(); });
/* 화면 점(마우스 위치) → 종이 안 좌표 (확대·축소를 되돌려 계산) */
function local(e) { const r = paper.getBoundingClientRect(); return { x: (e.clientX - r.left) / Z, y: (e.clientY - r.top) / Z }; }
const contentW = () => paper.offsetWidth - 2 * MARGIN;   // 글이 들어가는 폭

/* ════════════════════════════════════════════════
   3. 그림 상자 만들기
   ════════════════════════════════════════════════ */
const X_SVG = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="0" x2="100" y2="100" stroke="currentColor" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/><line x1="100" y1="0" x2="0" y2="100" stroke="currentColor" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>';
/* b = { id, side('left'|'right'|'full'), w(글 폭에 대한 비율 0~1), h(높이 px), fit('cover'|'contain') } */
function makeBox(b) {
  const f = document.createElement('span');   // span: 문단(<p>) 안에 들어갈 수 있는 조각
  f.className = 'box'; f.contentEditable = 'false';   // 상자 안은 글자처럼 고쳐지지 않음
  f.dataset.id = b.id; f.dataset.side = b.side; f.dataset.fit = b.fit || 'cover';
  f.dataset.w = b.w; f.dataset.h = b.h;
  sizeBox(f); fillBox(f);
  return f;
}
function sizeBox(f) {                                 // 데이터(비율·높이)대로 크기 맞추기
  f.style.width = f.dataset.side === 'full' ? '100%' : (Math.round(f.dataset.w * 1000) / 10) + '%';
  const k = Math.max(2, Math.round((+f.dataset.h + BOXM) / lineH));   // 상자+아래 간격이 줄 높이의 정수배가 되게
  f.style.height = (k * lineH - BOXM) + 'px';
}
function fillBox(f) {                                 // 그림이 있으면 그림, 없으면 X 표시
  const im = images.get(f.dataset.id);
  f.innerHTML = im ? '' : '<span class="ph">' + X_SVG + '<b>✕</b></span>';
  if (im) { const img = document.createElement('img'); img.src = im.url; img.alt = im.name; img.draggable = false; f.append(img); }
  f.append(h('span', '', 'grip'));                    // 오른쪽 아래 동그라미: 끌어서 크기 바꾸기
}
const allBoxes = () => [...ed.querySelectorAll('.box')];
const paras = () => [...ed.children].filter(n => n.tagName === 'P');

/* ════════════════════════════════════════════════
   4. 글 ↔ 저장 내용 (글은 txt, 상자는 짝꿍 파일)
   ════════════════════════════════════════════════ */
/* 화면 → 저장할 내용: 문단마다 한 줄, 상자는 "몇 번째 문단에 붙었는지 + 그 문단 앞부분 글"로 기억 */
function toModel() {
  const lines = [], boxes = [];
  paras().forEach((p, i) => {
    const c = p.cloneNode(true); c.querySelectorAll('.box').forEach(x => x.remove());
    const tx = c.textContent.replace(/​/g, '');   // 순수 글자만
    lines.push(tx);
    p.querySelectorAll('.box').forEach(f => {
      const im = images.get(f.dataset.id);
      boxes.push({ id: f.dataset.id, para: i, paraText: tx.slice(0, 30), side: f.dataset.side,
        w: +(+f.dataset.w).toFixed(3), h: +f.dataset.h, fit: f.dataset.fit, image: im ? 'images/' + im.name : null });
    });
  });
  return { text: lines.join('\n'), boxes };
}
/* 저장된 내용 → 화면: 줄마다 문단을 만들고, 상자를 그 문단 맨 앞에 붙임 */
function fromModel(text, boxes) {
  ed.innerHTML = '';
  text.split('\n').forEach(tx => { const p = document.createElement('p'); if (tx) p.textContent = tx; else p.append(document.createElement('br')); ed.append(p); });
  const ps = paras();
  (boxes || []).forEach(b => {
    let p = ps[b.para];
    // 다른 메모장에서 글을 고쳐 문단 위치가 바뀌었으면 → 기억해 둔 앞부분 글로 가장 비슷한 문단을 찾아 붙임
    if (b.paraText && (!p || !p.textContent.startsWith(b.paraText))) {
      const found = ps.find(q => q.textContent.startsWith(b.paraText));
      if (found) p = found;
    }
    p = p || ps[ps.length - 1];
    p.insertBefore(makeBox(b), p.firstChild);
  });
  ensureShape(); layoutSoon();
}
/* 글자판·붙여넣기 뒤에 문단 모양이 흐트러지면 바로잡기 (모든 줄이 <p> 하나씩이 되게) */
function ensureShape() {
  [...ed.childNodes].forEach(n => {
    if (n.nodeType === 1 && n.tagName === 'P') return;
    if (n.nodeType === 3 && !n.textContent.trim()) { n.remove(); return; }
    const p = document.createElement('p');
    if (n.nodeType === 1 && n.tagName === 'DIV') { while (n.firstChild) p.append(n.firstChild); n.replaceWith(p); }
    else if (n.nodeType === 1 && n.tagName === 'BR') { p.append(document.createElement('br')); n.replaceWith(p); }
    else { n.replaceWith(p); p.append(n); }
  });
  if (!ed.firstChild) { const p = document.createElement('p'); p.append(document.createElement('br')); ed.append(p); }
}

/* ════════════════════════════════════════════════
   5. 상태 표시줄 · 자동 보관(이 브라우저에)
   ════════════════════════════════════════════════ */
let saveT = null, fileSaved = true, curPage = 1;
function status() {
  const m = toModel();
  const chars = m.text.replace(/\n/g, '').length;
  const empty = m.boxes.filter(b => !b.image).length;
  $('sbPage').textContent = tf('페이지 {0} / {1}', Math.min(curPage, pages), pages);
  $('sbChars').textContent = tf('글 {0}자', chars.toLocaleString());
  $('sbBoxes').textContent = tf('그림 상자 {0}', m.boxes.length) + (empty ? ' ' + tf('(빈 상자 {0})', empty) : '');
  $('sbSaved').textContent = fileSaved ? t('저장됨') : t('저장 안 됨');
  $('dirty').hidden = fileSaved;
  $('sbEol').textContent = fileInfo.eol === 'CRLF' ? 'Windows (CR LF)' : 'Unix (LF)';
  $('sbEnc').textContent = fileInfo.enc;
  $('sbZoom').textContent = Math.round(Z * 100) + '%';
}
function changed() {                                  // 무언가 바뀔 때마다: 표시 + 1초 뒤 브라우저에 보관
  fileSaved = false; layoutSoon();
  clearTimeout(saveT); saveT = setTimeout(autosave, 1000);
}
function autosave() {                                 // 앱이 갑자기 꺼져도 글을 잃지 않게 이 브라우저에 보관
  const m = toModel();
  const imgs = {}; images.forEach((v, k) => { if (m.boxes.some(b => b.id === k)) imgs[k] = { name: v.name, data: v.data }; });
  let ok = store.set('doc', JSON.stringify({ name: $('docName').value, text: m.text, boxes: m.boxes, images: imgs, fileInfo }));
  if (!ok) store.set('doc', JSON.stringify({ name: $('docName').value, text: m.text, boxes: m.boxes, images: {}, fileInfo })); // 그림이 너무 크면 글·상자만
}
window.addEventListener('beforeunload', e => {        // 파일로 저장하지 않은 글이 있으면 닫기 전에 물어봄
  if (!fileSaved && toModel().text.trim()) { e.preventDefault(); e.returnValue = ''; }
});

/* ════════════════════════════════════════════════
   6. 실행 취소 · 다시 실행 (글과 그림 상자 모두)
   화면 모습을 통째로 찍어 두었다가 되돌림. 글은 0.5초 쉬면 한 번, 상자는 바뀔 때마다 바로 찍음
   ════════════════════════════════════════════════ */
const hist = []; let hi = -1, histT = null;
function snap() {
  clearTimeout(histT); histT = null;
  const s = ed.innerHTML;
  if (hist[hi] === s) return;
  hist.splice(hi + 1); hist.push(s); if (hist.length > 100) hist.shift();
  hi = hist.length - 1; undoState();
}
function undoState() { $('undoBtn').disabled = hi <= 0; $('redoBtn').disabled = hi >= hist.length - 1; }
function goHist(d) {
  if (histT) snap();                                  // 아직 찍지 않은 글 변화가 있으면 먼저 찍음
  const j = hi + d; if (j < 0 || j >= hist.length) return;
  hi = j; ed.innerHTML = hist[hi];
  ed.querySelectorAll('.box').forEach(f => { f.classList.remove('sel', 'lifting'); sizeBox(f); });
  selBox = null; selectBox(null); undoState(); changed();
}
$('undoBtn').onclick = () => goHist(-1);
$('redoBtn').onclick = () => goHist(1);
ed.addEventListener('beforeinput', e => {             // 폰·PC의 기본 실행 취소 대신 pitex의 것을 씀
  if (e.inputType === 'historyUndo') { e.preventDefault(); goHist(-1); }
  if (e.inputType === 'historyRedo') { e.preventDefault(); goHist(1); }
});
ed.addEventListener('input', () => {
  ensureShape();
  clearTimeout(histT); histT = setTimeout(snap, 500);
  changed(); placeBar();
});
/* 붙여넣기: 글자만 받음 (다른 곳의 색·글꼴이 섞여 들어오지 않게). 여러 줄이면 줄마다 문단 */
ed.addEventListener('paste', e => {
  e.preventDefault();
  const tx = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\r\n?/g, '\n');
  tx.split('\n').forEach((line, i) => { if (i) document.execCommand('insertParagraph'); if (line) document.execCommand('insertText', false, line); });
});

/* ════════════════════════════════════════════════
   7. 그림 상자 그리기 (탭 → 대각선으로 끌기 → X 상자)
   ════════════════════════════════════════════════ */
function setBoxMode(on) {
  boxMode = on; drawLayer.hidden = !on; $('drawHint').hidden = !on;
  $('boxBtn').classList.toggle('on', on);
  if (on) { toast(t('그림 상자 그리기: 대각선으로 끌어 보세요.')); selectBox(null); }
}
$('boxBtn').onclick = () => setBoxMode(!boxMode);
let dr = null;                                        // 그리는 중인 상자 { x0, y0, el, lab }
drawLayer.addEventListener('pointerdown', e => {
  const p = local(e);
  dr = { x0: p.x, y0: p.y, el: h('div', '', 'rect'), lab: h('div', '', 'size') };
  drawLayer.append(dr.el, dr.lab);
  try { drawLayer.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
drawLayer.addEventListener('pointermove', e => {
  if (!dr) return;
  const { x, y } = local(e);
  dr.x = Math.min(dr.x0, x); dr.y = Math.min(dr.y0, y); dr.w = Math.abs(x - dr.x0); dr.h = Math.abs(y - dr.y0);

/* ════════════════════════════════════════════════
   12. 보내기 5가지: PITEX · 텍스트 · 그림(JPG/PNG) · PDF · HTML (수정사항 3)
   ════════════════════════════════════════════════ */
const LIB = {                                         // 그림·PDF를 만드는 도구 (처음 쓸 때만 내려받음)
  h2c: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
};
function loadScript(src) {
  return new Promise((ok, no) => {
    if (document.querySelector(`script[data-src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.dataset.src = src; s.onload = ok; s.onerror = () => { s.remove(); no(new Error('load')); }; document.head.append(s);
  });
}
/* ① PITEX: 글 + 그림 상자 + 그림을 한 파일(.pitex)로 묶음 — pitex 사용자에게 보내기 좋음 */
async function exportPitex() { if (await saveBlob(new Blob([layerJson(true)], { type: 'application/x-pitex' }), docName() + '.pitex', T_PIT())) toast(t('PITEX 파일로 보냈습니다.')); }
/* ② 텍스트: 글만 (그림 없음) */
async function exportTxt() { const { bytes } = encodeTxt(toModel().text, fileInfo); if (await saveBlob(new Blob([bytes], { type: 'text/plain' }), docName() + '.txt', T_TXT())) toast(t('텍스트로 보냈습니다.')); }
/* ⑤ HTML: 웹브라우저로 바로 열리는 한 파일 (그림 포함) */
async function exportHtml() {
  const m = toModel(), esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const byPara = {}; m.boxes.forEach(b => (byPara[b.para] = byPara[b.para] || []).push(b));
  const body = m.text.split('\n').map((line, i) => {
    const figs = (byPara[i] || []).map(b => {
      const im = images.get(b.id); if (!im) return '';
      const st = b.side === 'full' ? 'width:100%' : `width:${(b.w * 100).toFixed(1)}%;float:${b.side};margin-${b.side === 'left' ? 'right' : 'left'}:14px`;
      return `<img src="${im.data}" alt="${esc(im.name)}" style="${st};height:${b.h}px;object-fit:${b.fit};display:block;margin-bottom:6px;border-radius:6px">`;
    }).join('');
    return `<p>${figs}${esc(line) || '<br>'}</p>`;
  }).join('\n');
  const font = `${/Italic/.test(prefs.style) ? 'italic ' : ''}${/Bold/.test(prefs.style) ? '700' : '400'} ${prefs.size}pt/1.7 "${prefs.font}", "Malgun Gothic", sans-serif`;
  const html = `<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>${esc(docName())}</title>\n<style>body{max-width:642px;margin:0 auto;padding:48px 20px;font:${font};color:#111;background:#fff}p{margin:0;display:flow-root;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}</style>\n</head>\n<body>\n${body}\n</body>\n</html>\n`;
  if (await saveBlob(new Blob([html], { type: 'text/html' }), docName() + '.html', { description: 'HTML', accept: { 'text/html': ['.html'] } })) toast(t('HTML로 보냈습니다.'));
}
/* 종이를 A4 페이지 그림들로 찍기 (그림·PDF 보내기에서 함께 씀) */
async function renderPages() {
  await loadScript(LIB.h2c);
  selectBox(null); if (boxMode) setBoxMode(false);
  const S = 2, keepZ = Z, keepScroll = [desk.scrollLeft, desk.scrollTop];
  Z = 1; layoutPages(); desk.scrollTo(0, 0);           // 찍는 동안만 100%로
  try {
    const full = await html2canvas(paper, { scale: S, backgroundColor: '#ffffff', logging: false, windowHeight: paper.offsetHeight + 200,
      onclone: doc => {                                // 복사본에서만: 밝은 색, 고름 표시·페이지 띠 숨김, 책상 펼치기
        doc.documentElement.setAttribute('data-theme', 'light'); doc.body.classList.add('exporting');
        doc.documentElement.style.overflow = doc.body.style.overflow = 'visible'; doc.body.style.height = 'auto';
        const d = doc.getElementById('desk'); d.style.overflow = 'visible'; d.style.flex = 'none';
        // 그림 찍는 도구가 '꽉 차게/다 보이게'(object-fit)를 몰라 그림이 찌그러짐 → 배경 그림 방식으로 바꿔 찍음
        doc.querySelectorAll('.box img').forEach(im => {
          const fit = im.closest('.box').dataset.fit === 'contain' ? 'contain' : 'cover';
          const dv = doc.createElement('div');
          dv.style.cssText = `width:100%;height:100%;border-radius:6px;background:url("${im.src}") center/${fit} no-repeat` + (fit === 'contain' ? ',#f6f4fd' : '');
          im.replaceWith(dv);
        });
      } });
    const out = [], W = Math.min(full.width, A4W * S);
    for (let k = 0; k < pages; k++) {                 // 페이지마다 A4 한 장: 위 여백 + 그 페이지의 줄들 + 아래 여백
      const c = document.createElement('canvas'); c.width = A4W * S; c.height = A4H * S;
      const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height);
      const sy = (MARGIN + k * pageH) * S, sh = Math.min(pageH * S, full.height - sy);
      if (sh > 0) g.drawImage(full, 0, sy, W, sh, 0, MARGIN * S, W, sh);
      out.push(c);
    }
    return out;
  } finally { Z = keepZ; layoutPages(); desk.scrollTo(keepScroll[0], keepScroll[1]); }
}
/* ③ 그림: JPG 또는 PNG를 고르면 모든 페이지를 위아래로 이어 붙인 한 장 */
function exportImageSheet() {
  openSheet(sh => {
    const row = h('div', '', 'row');
    row.append(btn('JPG', () => { closeSheet(); exportImage('jpeg'); }, 'primary'), btn('PNG', () => { closeSheet(); exportImage('png'); }));
    sh.append(h('h2', t('그림으로 보내기')), h('p', t('JPG는 파일이 작고, PNG는 글자가 더 또렷합니다. 여러 페이지는 위아래로 이어 붙여 한 장으로 만듭니다.')), row, btn(t('닫기'), closeSheet));
  });
}
async function exportImage(fmt) {
  toast(t('그림을 만드는 중…'), 10000);
  try {
    const ps = await renderPages(), gap = 24;
    const c = document.createElement('canvas'); c.width = ps[0].width; c.height = ps.length * ps[0].height + (ps.length - 1) * gap;
    const g = c.getContext('2d'); g.fillStyle = '#d9d8e0'; g.fillRect(0, 0, c.width, c.height);
    ps.forEach((p, i) => g.drawImage(p, 0, i * (p.height + gap)));
    const blob = await new Promise(ok => c.toBlob(ok, 'image/' + fmt, .92));
    const ext = fmt === 'png' ? '.png' : '.jpg';
    if (await saveBlob(blob, docName() + ext, { description: fmt.toUpperCase(), accept: { ['image/' + fmt]: [ext] } })) toast(t('그림으로 보냈습니다.'));
  } catch (e) { toast(t('그림을 만들지 못했습니다. 인터넷 연결을 확인해 주세요.'), 4000); }
}
/* ④ PDF: A4 페이지 그대로 */
async function exportPdf() {
  toast(t('PDF를 만드는 중…'), 10000);
  try {
    const ps = await renderPages(); await loadScript(LIB.pdf);
    const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    ps.forEach((c, i) => { if (i) doc.addPage(); doc.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, 210, 297); });
    if (await saveBlob(doc.output('blob'), docName() + '.pdf', { description: 'PDF', accept: { 'application/pdf': ['.pdf'] } })) toast(t('PDF로 보냈습니다.'));
  } catch (e) { toast(t('PDF를 만들지 못했습니다. 인터넷 연결을 확인해 주세요.'), 4000); }
}

/* 파일 이름 칸: 글자 수만큼만 넓게 (한글은 두 칸) */

  if (e.key === 'F3') { e.preventDefault(); findNext(); return; }

  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();

  else if (k === 's' && e.shiftKey) { e.preventDefault(); saveAs(); }

  else if (k === 'w') { e.preventDefault(); closeDoc(); }

  else if (k === 'n') { e.preventDefault(); newDoc(); }
  else if (k === 'p') { e.preventDefault(); window.print(); }
  else if (k === '=' || k === '+') { e.preventDefault(); zoom(1); }

function openFind(repl) {
  $('findbar').hidden = false; $('tbFind').classList.add('on');
  const s = getSelection().toString();
  if (s && !s.includes('\n')) $('findText').value = s;    // 선택한 말이 있으면 그대로 찾을 말로
  (repl && $('findText').value ? $('replText') : $('findText')).focus();

$('findClose').onclick = closeFind;
/* 문단 p 안의 글자 조각들(text node)과 그 위치표 */
function textMap(p) {
  const nodes = [], w = document.createTreeWalker(p, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.box') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n, text = ''; while ((n = w.nextNode())) { nodes.push({ n, at: text.length }); text += n.nodeValue; }
  return { nodes, text };
}
function rangeIn(map, start, end) {                   // 문단 글자 위치(시작~끝) → 화면에서 선택할 범위
  const pos = i => { for (let k = map.nodes.length - 1; k >= 0; k--) if (map.nodes[k].at <= i) return [map.nodes[k].n, i - map.nodes[k].at]; };
  const r = document.createRange(); const [a, ao] = pos(start), [b, bo] = pos(end);
  r.setStart(a, ao); r.setEnd(b, bo); return r;
}
function findNext(silent) {
  const q = $('findText').value; if (!q) { openFind(); return false; }
  const cs = $('findCase').checked, norm = s => cs ? s : s.toLowerCase();
  const ps = paras(), sel = getSelection();
  let startP = 0, startAt = 0;                        // 지금 커서(선택) 뒤에서부터 찾음
  if (sel.rangeCount && ed.contains(sel.anchorNode)) {
    const r = sel.getRangeAt(0), p = (r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement).closest('p');
    if (p) { startP = Math.max(0, ps.indexOf(p)); const m = textMap(p); const e = m.nodes.find(x => x.n === r.endContainer); startAt = e ? e.at + r.endOffset : 0; }
  }
  for (let k = 0; k <= ps.length; k++) {
    const i = (startP + k) % ps.length, m = textMap(ps[i]);
    const from = k === 0 ? startAt : 0;
    const at = norm(m.text).indexOf(norm(q), from);
    if (at >= 0 && !(k === ps.length && at < startAt)) {
      const r = rangeIn(m, at, at + q.length); sel.removeAllRanges(); sel.addRange(r);
      const rc = r.getBoundingClientRect(), dr2 = desk.getBoundingClientRect();
      if (rc.top < dr2.top + 20 || rc.bottom > dr2.bottom - 20) desk.scrollBy(0, rc.top - dr2.top - dr2.height / 3);   // 찾은 곳이 보이게 책상을 밀기
      $('findMsg').textContent = '';

$('replOne').onclick = () => {                        // 지금 선택된 것이 찾는 말이면 바꾸고 다음으로

$('replAll').onclick = () => {                        // 모든 문단에서 한꺼번에 바꾸기 (그림 상자는 그대로)

  if (n) { snap(); changed(); }
  $('findMsg').textContent = n ? tf('{0}곳을 바꿨습니다.', n) : t('찾는 말이 없습니다.');
};

/* ════════════════════════════════════════════════
   17. 상태 표시줄의 '줄, 열'과 '지금 페이지' (커서가 있는 곳)

document.addEventListener('selectionchange', () => {
  const s = getSelection(); if (!s.rangeCount || !ed.contains(s.focusNode)) return;

});

  "이 시험판(PWA)에서는 화면의 글만 지우고, PC의 파일은 그대로 둡니다. 파일을 휴지통으로 보내는 기능은 Tauri(.exe) 판에서 넣습니다.": ["This trial (PWA) only clears the document on screen; files on your PC are kept. Sending files to the Recycle Bin comes in the Tauri (.exe) version.", "この試用版（PWA）では画面の文書だけを消去し、PCのファイルはそのまま残します。ファイルをごみ箱に送る機能は Tauri（.exe）版で追加します。", "此试用版（PWA）只清除屏幕上的文档，电脑中的文件保持不变。将文件移到回收站的功能会在 Tauri（.exe）版中加入。", "此試用版（PWA）只清除螢幕上的文件，電腦中的檔案保持不變。將檔案移到回收站的功能會在 Tauri（.exe）版中加入。", "Bản thử (PWA) này chỉ xóa tài liệu trên màn hình, tệp trên PC vẫn giữ nguyên. Tính năng chuyển tệp vào Thùng rác sẽ có ở bản Tauri (.exe).", "Diese Testversion (PWA) leert nur das Dokument auf dem Bildschirm; Dateien auf dem PC bleiben erhalten. Das Verschieben in den Papierkorb kommt in der Tauri-Version (.exe).", "Cette version d’essai (PWA) n’efface que le document à l’écran ; les fichiers du PC sont conservés. L’envoi à la Corbeille viendra avec la version Tauri (.exe).", "Esta versão de teste (PWA) só limpa o documento na tela; os arquivos do PC são mantidos. Enviar à Lixeira virá na versão Tauri (.exe).", "Esta versión de prueba (PWA) solo borra el documento en pantalla; los archivos de la PC se conservan. Enviar a la Papelera llegará en la versión Tauri (.exe)."],
